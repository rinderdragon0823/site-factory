<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磁力線 — 見えない力を、線にする。</title>
<meta name="description" content="磁気双極子の磁力線を可視化。2つの磁石のあいだの磁場を、数値積分で線にして描きます。">
<meta property="og:title" content="磁力線 — 見えない力を、線にする。">
<meta property="og:description" content="各点の向きを計算して、その方向に少し進む。それを繰り返すと磁力線になります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/magnetic-dipole/">
<meta property="og:site_name" content="磁力線">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --cyan:#67e8f9;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #0f2633 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #1a1430 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--cyan);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.35rem,5vw,1.85rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #view{display:block;width:100%;height:auto}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:112px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--cyan);min-width:0;cursor:pointer}
  .row output{width:66px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .readout{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--muted)}
  .readout b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--cyan)}
  .actions button[aria-pressed="true"]{background:var(--cyan);color:#04281f;border-color:var(--cyan)}
  .actions button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">MAGNETIC FIELD</p>
      <h1>磁力線</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms / 0 本</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="720" height="480" role="img" aria-label="磁力線のパターン"></canvas>
  </div>

  <div class="panel">
    <div class="row"><label for="gap">磁石の間隔</label><input id="gap" type="range" min="0" max="220" step="5" value="140"><output id="gapVal">140</output></div>
    <div class="row"><label for="lines">線の本数</label><input id="lines" type="range" min="6" max="30" step="1" value="16"><output id="linesVal">16</output></div>
    <div class="readout">
      <span>磁極の数 <b id="poles">2</b></span>
      <span>サンプル点 <b id="samples">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="two" aria-pressed="true">2つの磁石</button>
  </div>

  <p class="note">
    <b>各点の磁場の向きを足し合わせ、その方向へ少しずつ進む</b>（数値積分）。N極から出てS極へ入る線が、磁力線として描かれます。
    2つの磁石を近づけると、間の磁場が強まって線の形が変わります。線の明るさは磁場の強さです。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 720, H = 480;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var polesEl = document.getElementById("poles");
  var samplesEl = document.getElementById("samples");
  var gapEl = document.getElementById("gap");
  var linesEl = document.getElementById("lines");
  var gapVal = document.getElementById("gapVal");
  var linesVal = document.getElementById("linesVal");

  var gap = 140;
  var nLines = 16;
  var twoMagnets = true;

  function field(x, y) {
    var bx = 0, by = 0;
    var magnets = twoMagnets ? [[W / 2 - gap / 2, 0], [W / 2 + gap / 2, 0]] : [[W / 2, 0]];

    for (var i = 0; i < magnets.length; i++) {
      var mx = magnets[i][0];
      var topY = H / 2 - 34;
      var botY = H / 2 + 34;

      // N極（上）から出る、S極（下）へ入る
      var dx1 = x - mx, dy1 = y - topY;
      var r1 = Math.pow(Math.sqrt(dx1 * dx1 + dy1 * dy1), 3) + 1e-3;
      bx += dx1 / r1; by += dy1 / r1;

      var dx2 = x - mx, dy2 = y - botY;
      var r2 = Math.pow(Math.sqrt(dx2 * dx2 + dy2 * dy2), 3) + 1e-3;
      bx -= dx2 / r2; by -= dy2 / r2;
    }
    return [bx, by];
  }

  function drawField() {
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, W, H);

    var magnets = twoMagnets ? [W / 2 - gap / 2, W / 2 + gap / 2] : [W / 2];
    var samples = 0;
    var step = 2.0;

    ctx.lineWidth = 1.1;

    for (var m = 0; m < magnets.length; m++) {
      var mx = magnets[m];

      for (var k = 0; k < nLines; k++) {
        // 磁石のまわりから種を撒く
        var ang = (k / nLines) * Math.PI * 2;
        var x = mx + Math.cos(ang) * 40;
        var y = H / 2 + Math.sin(ang) * 70;

        ctx.beginPath();
        ctx.moveTo(x, y);

        var fade = 0.5;

        for (var s = 0; s < 260; s++) {
          var f = field(x, y);
          var len = Math.hypot(f[0], f[1]);
          if (len < 1e-6) break;

          x += (f[0] / len) * step;
          y += (f[1] / len) * step;

          if (x < -40 || x > W + 40 || y < -40 || y > H + 40) break;
          if (len > 0.8) fade = 0.9;

          ctx.lineTo(x, y);
          samples++;
        }

        ctx.strokeStyle = "rgba(103,232,249," + (0.14 + Math.min(0.5, fade * 0.6)) + ")";
        ctx.stroke();
      }
    }

    // 磁石
    for (var q = 0; q < magnets.length; q++) {
      var cx = magnets[q];
      ctx.fillStyle = "rgba(248,113,113,.9)";
      ctx.fillRect(cx - 12, H / 2 - 34, 24, 34);
      ctx.fillStyle = "rgba(96,165,250,.9)";
      ctx.fillRect(cx - 12, H / 2, 24, 34);
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.font = '700 10px "Hiragino Sans","Yu Gothic",system-ui,sans-serif';
      ctx.fillText("N", cx - 4, H / 2 - 14);
      ctx.fillText("S", cx - 4, H / 2 + 22);
    }

    samplesEl.textContent = samples.toLocaleString("en-US");
    polesEl.textContent = String(magnets.length * 2);
  }

  var frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) fpsTimer = now;
    var t0 = performance.now();
    drawField();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    msEl.textContent = smooth.toFixed(1) + " ms / " + (nLines * (twoMagnets ? 2 : 1)) + " 本";
    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  gapEl.addEventListener("input", function () { gap = Number(gapEl.value); gapVal.textContent = String(gap); });
  linesEl.addEventListener("input", function () { nLines = Number(linesEl.value); linesVal.textContent = String(nLines); });
  document.getElementById("two").addEventListener("click", function () {
    twoMagnets = !twoMagnets;
    this.setAttribute("aria-pressed", twoMagnets ? "true" : "false");
    this.textContent = twoMagnets ? "2つの磁石" : "1つの磁石";
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
