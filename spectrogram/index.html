<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スペクトログラム — 音の歴史が、横に流れる。</title>
<meta name="description" content="FFTで音を分解して、時間×周波数の地図として描くスペクトログラム。掃引音・倍音・ノイズが色の帯になって流れます。">
<meta property="og:title" content="スペクトログラム — 音の歴史が、横に流れる。">
<meta property="og:description" content="音を1024点のFFTにかけて、周波数ごとの強さを色にして横に流す。音が見える技術デモ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/spectrogram/">
<meta property="og:site_name" content="スペクトログラム">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#04050a">
<style>
  :root{
    --bg:#04050a;
    --panel:#0b1018;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --gold:#fbbf24;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #2a1f0f 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #141028 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:720px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--gold);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#02030a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #spec{display:block;width:100%;height:auto}

  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{
    flex:1 1 0;font:inherit;font-size:11.5px;font-weight:800;
    color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:999px;
    padding:9px 10px;min-height:38px;cursor:pointer;
  }
  .presets button:hover{color:var(--ink);border-color:var(--gold)}
  .presets button[aria-pressed="true"]{background:var(--gold);color:#231a04;border-color:var(--gold)}
  .presets button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:96px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--gold);min-width:0;cursor:pointer}
  .row output{width:62px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">FFT WATERFALL</p>
      <h1>スペクトログラム</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms / 1024点</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="spec" width="640" height="300" role="img" aria-label="時間と周波数のスペクトログラム"></canvas>
  </div>

  <div class="presets" role="group" aria-label="信号">
    <button type="button" data-p="sweep" aria-pressed="true">掃引</button>
    <button type="button" data-p="chord" aria-pressed="false">和音</button>
    <button type="button" data-p="noise" aria-pressed="false">ノイズ</button>
  </div>

  <div class="panel">
    <div class="row"><label for="speed">掃引の速さ</label><input id="speed" type="range" min="0.05" max="1.2" step="0.01" value="0.35"><output id="speedVal">0.35</output></div>
    <div class="row"><label for="harm">倍音</label><input id="harm" type="range" min="1" max="8" step="1" value="4"><output id="harmVal">4</output></div>
    <div class="row"><label for="noise">ノイズ</label><input id="noise" type="range" min="0" max="1" step="0.02" value="0.06"><output id="noiseVal">0.06</output></div>
    <div class="row"><label for="range">表示レンジ</label><input id="range" type="range" min="30" max="100" step="2" value="70"><output id="rangeVal">70</output></div>
  </div>

  <p class="note">
    <b>1024サンプルを切り出して、ハン窓をかけてFFT</b>。周波数ごとの強さを、横軸＝時間、縦軸＝周波数（対数）の色にして流しています。
    掃引は時間とともに周波数が上下する音。倍音を増やすと、縞が何本にもなります。音は鳴りません。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 640, H = 300;
  var canvas = document.getElementById("spec");
  var ctx = canvas.getContext("2d", { alpha: false });
  var img = ctx.createImageData(W, H);
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var speedEl = document.getElementById("speed");
  var harmEl = document.getElementById("harm");
  var noiseEl = document.getElementById("noise");
  var rangeEl = document.getElementById("range");
  var speedVal = document.getElementById("speedVal");
  var harmVal = document.getElementById("harmVal");
  var noiseVal = document.getElementById("noiseVal");
  var rangeVal = document.getElementById("rangeVal");

  var SR = 8000;
  var N = 1024;
  var HOP = 220;

  var samples = new Float32Array(N);
  var windowed = new Float32Array(N);
  var re = new Float32Array(N);
  var im = new Float32Array(N);
  var win = new Float32Array(N);

  var signal = "sweep";
  var speed = 0.35;
  var harmonics = 4;
  var noiseAmt = 0.06;
  var rangeDb = 70;

  var tSec = 0;
  var phase = 0;
  var writePos = 0;

  var LUT = new Uint8Array(256 * 3);
  (function buildLut() {
    var stops = [
      [0, [0, 0, 4]],
      [0.18, [40, 11, 84]],
      [0.38, [101, 21, 110]],
      [0.55, [159, 42, 99]],
      [0.72, [212, 72, 66]],
      [0.86, [245, 125, 21]],
      [0.95, [250, 193, 39]],
      [1, [252, 255, 216]]
    ];
    for (var i = 0; i < 256; i++) {
      var t = i / 255;
      var a = stops[0], b = stops[stops.length - 1];
      for (var k = 0; k < stops.length - 1; k++) {
        if (t >= stops[k][0] && t <= stops[k + 1][0]) { a = stops[k]; b = stops[k + 1]; break; }
      }
      var f = (t - a[0]) / Math.max(0.0001, b[0] - a[0]);
      LUT[i * 3] = a[1][0] + (b[1][0] - a[1][0]) * f;
      LUT[i * 3 + 1] = a[1][1] + (b[1][1] - a[1][1]) * f;
      LUT[i * 3 + 2] = a[1][2] + (b[1][2] - a[1][2]) * f;
    }
  })();

  for (var w = 0; w < N; w++) win[w] = 0.5 - 0.5 * Math.cos(2 * Math.PI * w / (N - 1));

  function writeSamples(count) {
    for (var i = 0; i < count; i++) {
      var f0;
      if (signal === "chord") {
        f0 = 330;
      } else if (signal === "noise") {
        f0 = 180;
      } else {
        var lfo = 0.5 + 0.5 * Math.sin(tSec * speed * 2.2);
        f0 = 120 * Math.pow(14, lfo);
      }

      var s = 0;
      if (signal === "noise") {
        s = (Math.random() * 2 - 1) * 0.5;
      } else {
        for (var h = 1; h <= harmonics; h++) {
          s += Math.sin(2 * Math.PI * f0 * h * tSec + h * 0.7) / h;
        }
        s *= 0.5;
      }
      s += (Math.random() * 2 - 1) * noiseAmt;

      var pos = (writePos + i) % N;
      samples[pos] = s;
      tSec += 1 / SR;
    }
    writePos = (writePos + count) % N;
  }

  function fft() {
    var n = N;
    for (var i = 0; i < n; i++) {
      re[i] = windowed[i];
      im[i] = 0;
    }
    // bit reversal
    for (var i2 = 1, j = 0; i2 < n; i2++) {
      var bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i2 < j) {
        var tr = re[i2]; re[i2] = re[j]; re[j] = tr;
        var ti = im[i2]; im[i2] = im[j]; im[j] = ti;
      }
    }
    for (var len = 2; len <= n; len <<= 1) {
      var ang = -2 * Math.PI / len;
      var wr = Math.cos(ang), wi = Math.sin(ang);
      for (var i3 = 0; i3 < n; i3 += len) {
        var cr = 1, ci = 0;
        for (var k = 0; k < len / 2; k++) {
          var ur = re[i3 + k], ui = im[i3 + k];
          var vr = re[i3 + k + len / 2] * cr - im[i3 + k + len / 2] * ci;
          var vi = re[i3 + k + len / 2] * ci + im[i3 + k + len / 2] * cr;
          re[i3 + k] = ur + vr;
          im[i3 + k] = ui + vi;
          re[i3 + k + len / 2] = ur - vr;
          im[i3 + k + len / 2] = ui - vi;
          var ncr = cr * wr - ci * wi;
          ci = cr * wi + ci * wr;
          cr = ncr;
        }
      }
    }
  }

  function shiftColumn() {
    var data = img.data;
    for (var y = 0; y < H; y++) {
      var row = y * W * 4;
      data.copyWithin(row, row + 4, row + W * 4);
    }
  }

  var peakHz = 0;

  function drawColumn() {
    var data = img.data;
    var offset = (W - 1) * 4;
    var fMin = 60, fMax = SR / 2;
    var binHz = SR / N;
    var nBins = N / 2;

    // 自動ゲイン: いまのフレームの最大値に合わせる
    var peak = 1e-9;
    for (var b = 1; b < nBins; b++) {
      var m = Math.sqrt(re[b] * re[b] + im[b] * im[b]);
      if (m > peak) peak = m;
    }
    var peakDb = 20 * Math.log10(peak);

    var bestF = 0, bestT = -1;

    for (var y = 0; y < H; y++) {
      var frac = 1 - y / (H - 1);
      var f = fMin * Math.pow(fMax / fMin, frac);
      var bin = Math.round(f / binHz);
      if (bin < 1) bin = 1;
      if (bin > nBins - 1) bin = nBins - 1;

      var mag = Math.sqrt(re[bin] * re[bin] + im[bin] * im[bin]);
      var db = 20 * Math.log10(mag + 1e-9);
      var t = 1 + (db - peakDb) / rangeDb;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      if (t > bestT) { bestT = t; bestF = f; }

      var idx = (Math.pow(t, 0.75) * 255) | 0;
      var o = idx * 3;
      var q = y * W * 4 + offset;
      data[q] = LUT[o];
      data[q + 1] = LUT[o + 1];
      data[q + 2] = LUT[o + 2];
      data[q + 3] = 255;
    }
    peakHz = bestF;
  }

  function analyze() {
    for (var i = 0; i < N; i++) {
      windowed[i] = samples[(writePos + i) % N] * win[i];
    }
    fft();
  }

  var frames = 0, fpsTimer = 0, smooth = 0;

  function loop(now) {
    if (!fpsTimer) fpsTimer = now;

    var t0 = performance.now();
    writeSamples(HOP);
    analyze();
    shiftColumn();
    drawColumn();
    ctx.putImageData(img, 0, 0);
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      msEl.textContent = smooth.toFixed(2) + " ms / peak " + Math.round(peakHz) + " Hz";
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  document.querySelectorAll(".presets button").forEach(function (b) {
    b.addEventListener("click", function () {
      signal = b.getAttribute("data-p");
      document.querySelectorAll(".presets button").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
    });
  });

  speedEl.addEventListener("input", function () { speed = Number(speedEl.value); speedVal.textContent = speed.toFixed(2); });
  harmEl.addEventListener("input", function () { harmonics = Number(harmEl.value); harmVal.textContent = String(harmonics); });
  noiseEl.addEventListener("input", function () { noiseAmt = Number(noiseEl.value); noiseVal.textContent = noiseAmt.toFixed(2); });
  rangeEl.addEventListener("input", function () { rangeDb = Number(rangeEl.value); rangeVal.textContent = String(rangeDb); });

  // 初期化
  for (var i = 0; i < W * H * 4; i += 4) { img.data[i + 3] = 255; }
  writeSamples(N);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
