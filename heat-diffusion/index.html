<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熱伝導 — 熱は、じわじわ広がる。</title>
<meta name="description" content="2次元熱伝導方程式の可視化。ドラッグで熱を加えると、周りへじわじわ伝わって冷えていきます。">
<meta property="og:title" content="熱伝導 — 熱は、じわじわ広がる。">
<meta property="og:description" content="隣との温度差だけを見て、少しずつ平均に近づく。それだけで熱が伝わります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/heat-diffusion/">
<meta property="og:site_name" content="熱伝導">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --amber:#fb923c;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #2c1a0e 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #101a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:720px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--amber);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55);touch-action:none}
  #view{display:block;width:100%;height:auto;cursor:crosshair}
  .hint{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(233,239,248,.45);pointer-events:none}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:108px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--amber);min-width:0;cursor:pointer}
  .row output{width:64px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--amber)}
  .actions button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">HEAT EQUATION</p>
      <h1>熱伝導</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms / 180×140</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="540" height="420" role="img" aria-label="熱が伝わる様子"></canvas>
    <div class="hint">ドラッグで熱を加えられます</div>
  </div>

  <div class="panel">
    <div class="row"><label for="cond">伝わりやすさ</label><input id="cond" type="range" min="0.02" max="0.24" step="0.01" value="0.14"><output id="condVal">0.14</output></div>
    <div class="row"><label for="cool">冷えやすさ</label><input id="cool" type="range" min="0" max="0.02" step="0.001" value="0.002"><output id="coolVal">0.002</output></div>
    <div class="row"><label for="heat">熱の強さ</label><input id="heat" type="range" min="0.2" max="2" step="0.05" value="1"><output id="heatVal">1.00</output></div>
  </div>

  <div class="actions">
    <button type="button" id="clear">冷ます</button>
    <button type="button" id="pause">停止</button>
  </div>

  <p class="note">
    <b>各マスの温度を「隣4マスとの差」に比例して少しだけ動かす</b>（2次元熱伝導方程式の陽解法）。熱い所から冷たい所へ流れ、全体がならされていきます。
    色は温度、境目がぼやけていく様子がそのまま見えます。
  </p>
</main>

<script>
(function () {
  "use strict";

  var GW = 180, GH = 140;
  var CELL = 3;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var img = ctx.createImageData(GW, GH);
  var off = document.createElement("canvas");
  off.width = GW;
  off.height = GH;
  var octx = off.getContext("2d");
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var condEl = document.getElementById("cond");
  var coolEl = document.getElementById("cool");
  var heatEl = document.getElementById("heat");
  var condVal = document.getElementById("condVal");
  var coolVal = document.getElementById("coolVal");
  var heatVal = document.getElementById("heatVal");

  var T = new Float32Array(GW * GH);
  var T2 = new Float32Array(GW * GH);
  var cond = 0.14;
  var cool = 0.002;
  var heatPower = 1;
  var running = true;

  var dragging = false, dragX = -1, dragY = -1;

  function addHeat(cx, cy, amount) {
    var r = 6;
    for (var dy = -r; dy <= r; dy++) {
      for (var dx = -r; dx <= r; dx++) {
        var x = cx + dx, y = cy + dy;
        if (x < 1 || y < 1 || x >= GW - 1 || y >= GH - 1) continue;
        var d2 = dx * dx + dy * dy;
        if (d2 > r * r) continue;
        T[y * GW + x] += amount * (1 - d2 / (r * r));
      }
    }
  }

  function step() {
    for (var y = 1; y < GH - 1; y++) {
      for (var x = 1; x < GW - 1; x++) {
        var i = y * GW + x;
        var c = T[i];
        var lap = T[i - 1] + T[i + 1] + T[i - GW] + T[i + GW] - 4 * c;
        var v = c + lap * cond - c * cool;
        T2[i] = v < 0 ? 0 : (v > 3 ? 3 : v);
      }
    }
    for (var y2 = 1; y2 < GH - 1; y2++) {
      for (var x2 = 1; x2 < GW - 1; x2++) {
        var j = y2 * GW + x2;
        T[j] = T2[j];
      }
    }
  }

  function draw() {
    var d = img.data;
    var p = 0;
    for (var i = 0; i < GW * GH; i++) {
      var v = T[i];
      var t = Math.min(1, Math.pow(v, 0.55) * 1.45);
      var r, g, b;
      if (t < 0.35) {
        var k = t / 0.35;
        r = 10 + 90 * k; g = 12 + 40 * k; b = 30 + 90 * k;
      } else if (t < 0.7) {
        var k2 = (t - 0.35) / 0.35;
        r = 100 + 155 * k2; g = 52 + 90 * k2; b = 120 - 90 * k2;
      } else {
        var k3 = (t - 0.7) / 0.3;
        r = 255; g = 142 + 100 * k3; b = 30 + 170 * k3;
      }
      d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = 255;
      p += 4;
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
  }

  var frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) fpsTimer = now;
    var t0 = performance.now();

    if (running) {
      if (dragging && dragX >= 0) addHeat(dragX, dragY, heatPower * 0.35);
      step();
    }
    draw();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      msEl.textContent = smooth.toFixed(1) + " ms / " + GW + "×" + GH;
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  function localPos(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: Math.floor((e.clientX - rect.left) / rect.width * GW),
      y: Math.floor((e.clientY - rect.top) / rect.height * GH)
    };
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    dragging = true;
    var p = localPos(e);
    dragX = p.x; dragY = p.y;
    addHeat(p.x, p.y, heatPower * 1.2);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var p = localPos(e);
    dragX = p.x; dragY = p.y;
  });
  function end() { dragging = false; dragX = -1; dragY = -1; }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("pointerleave", end);

  condEl.addEventListener("input", function () { cond = Number(condEl.value); condVal.textContent = cond.toFixed(2); });
  coolEl.addEventListener("input", function () { cool = Number(coolEl.value); coolVal.textContent = cool.toFixed(3); });
  heatEl.addEventListener("input", function () { heatPower = Number(heatEl.value); heatVal.textContent = heatPower.toFixed(2); });

  document.getElementById("clear").addEventListener("click", function () { T.fill(0); T2.fill(0); });
  document.getElementById("pause").addEventListener("click", function () {
    running = !running;
    this.textContent = running ? "停止" : "再開";
  });

  // 最初の熱
  addHeat(GW * 0.35, GH * 0.5, 2.6);
  addHeat(GW * 0.7, GH * 0.35, 2.0);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
