<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Factory — 3 個の小さな道具</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 20px 80px; background: #0b0c10; color: #e8eaf0;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif; }
  header { max-width: 880px; margin: 0 auto 32px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
  header p { margin: 0; color: #9aa3b2; }
  main { max-width: 880px; margin: 0 auto; display: grid; gap: 12px; }
  .card { display: block; padding: 18px 20px; border: 1px solid #23262f; border-radius: 14px;
          background: #12141a; color: inherit; text-decoration: none; transition: .15s; }
  .card:hover { border-color: #4b5566; transform: translateY(-1px); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h2 { font-size: 17px; margin: 0; }
  time { color: #7d8698; font-size: 12px; white-space: nowrap; }
  .card p { margin: 6px 0 10px; color: #b9c0cd; font-size: 14px; }
  .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: #8b93a3; }
  .tag { border: 1px solid #2c313c; border-radius: 999px; padding: 1px 8px; }
  code { color: #7d8698; }
  footer { max-width: 880px; margin: 32px auto 0; color: #6b7385; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Site Factory</h1>
    <p>3時間ごとに1個ずつ増える、小さなゲームと道具。3 個収録。</p>
  </header>
  <main>
      <a class="card" href="./tatoe-zan/">
        <div class="row"><h2>たとえ算</h2><time>2026-10-20</time></div>
        <p>金額を入れるだけで、うまい棒・牛丼・映画・新幹線に変換。出費が少しだけ愛しくなる計算機。</p>
        <div class="meta"><span class="tag">tool</span><code>/tatoe-zan/</code></div>
      </a>
      <a class="card" href="./just-3s/">
        <div class="row"><h2>3秒ジャスト</h2><time>2026-10-20</time></div>
        <p>3.00秒ぴったりで止めて、体内時計のズレをミリ秒で採点。</p>
        <div class="meta"><span class="tag">game</span><code>/just-3s/</code></div>
      </a>
      <a class="card" href="./iiwake-maker/">
        <div class="row"><h2>言い訳メーカー</h2><time>2026-10-20</time></div>
        <p>状況を選ぶだけで、それっぽい言い訳と説得力スコアが出る自白装置。</p>
        <div class="meta"><span class="tag">tool</span><code>/iiwake-maker/</code></div>
      </a>
  </main>
  <footer>単一HTMLファイル / 外部依存なし / スマホ対応</footer>
</body>
</html>
