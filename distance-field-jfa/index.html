<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>距離場 — 飛び飛びに調べて、一気に近づく。</title>
<meta name="description" content="Jump Flooding Algorithm で距離場とボロノイ領域を計算する技術デモ。パスを増やすと一気に正確になります。">
<meta property="og:title" content="距離場 — 飛び飛びに調べて、一気に近づく。">
<meta property="og:description" content="半分、4分の1、8分の1…と飛びながら近くの種を探すと、log回で距離場ができます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/distance-field-jfa/">
<meta property="og:site_name" content="距離場">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --mint:#6ee7b7;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #10281e 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #141a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--mint);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.35rem,5vw,1.85rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55);touch-action:none}
  #view{display:block;width:100%;height:auto;cursor:crosshair}
  .hint{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(233,239,248,.45);pointer-events:none}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:112px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--mint);min-width:0;cursor:pointer}
  .row output{width:70px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .readout{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--muted)}
  .readout b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--mint)}
  .actions button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">JUMP FLOODING</p>
      <h1>距離場</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="720" height="480" role="img" aria-label="距離場とボロノイ領域"></canvas>
    <div class="hint">クリックで種を追加</div>
  </div>

  <div class="panel">
    <div class="row"><label for="passes">パスの段数</label><input id="passes" type="range" min="1" max="9" step="1" value="9"><output id="passesVal">9</output></div>
    <div class="row"><label for="seeds">種の数</label><input id="seeds" type="range" min="4" max="60" step="1" value="18"><output id="seedsVal">18</output></div>
    <div class="readout">
      <span>今のステップ <b id="stepNow">256</b></span>
      <span>最遠距離 <b id="maxDist">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="shuffle">種を散らす</button>
  </div>

  <p class="note">
    <b>周囲の「半分・4分の1・8分の1…」の位置だけを見て、一番近い種を引き継ぐ</b>（ジャンプフラッディング）。全部の画素を総当たりせずに、log₂(サイズ) 回で距離場が作れます。
    パスが少ないと領域がガタガタになり、増やすと滑らかになります。同心円は距離の等高線です。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 720, H = 480;
  var GW = 240, GH = 160;
  var CW = W / GW, CH = H / GH;

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var img = ctx.createImageData(GW, GH);
  var off = document.createElement("canvas");
  off.width = GW;
  off.height = GH;
  var octx = off.getContext("2d");
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var stepNowEl = document.getElementById("stepNow");
  var maxDistEl = document.getElementById("maxDist");
  var passesEl = document.getElementById("passes");
  var seedsEl = document.getElementById("seeds");
  var passesVal = document.getElementById("passesVal");
  var seedsVal = document.getElementById("seedsVal");

  var maxPasses = 9;
  var passes = 9;
  var nSeeds = 18;
  var seeds = [];

  var nearX = new Int16Array(GW * GH);
  var nearY = new Int16Array(GW * GH);
  var nearS = new Int16Array(GW * GH);

  function initSeeds() {
    seeds = [];
    for (var i = 0; i < nSeeds; i++) {
      seeds.push({
        x: (Math.random() * GW) | 0,
        y: (Math.random() * GH) | 0,
        hue: (i * 360 / nSeeds + Math.random() * 20) % 360
      });
    }
  }

  function runJFA() {
    var n = GW * GH;
    for (var i = 0; i < n; i++) {
      nearS[i] = -1;
      nearX[i] = 0;
      nearY[i] = 0;
    }
    for (var s = 0; s < seeds.length; s++) {
      var idx = seeds[s].y * GW + seeds[s].x;
      nearS[idx] = s;
      nearX[idx] = seeds[s].x;
      nearY[idx] = seeds[s].y;
    }

    var step = 1;
    while (step * 2 <= Math.max(GW, GH)) step *= 2;

    var usedStep = step;
    for (var p = 0; p < passes; p++) {
      var nextS = new Int16Array(n);
      var nextX = new Int16Array(n);
      var nextY = new Int16Array(n);

      for (var y = 0; y < GH; y++) {
        for (var x = 0; x < GW; x++) {
          var bestS = nearS[y * GW + x];
          var bestX = nearX[y * GW + x];
          var bestY = nearY[y * GW + x];
          var bestD = bestS >= 0 ? (x - bestX) * (x - bestX) + (y - bestY) * (y - bestY) : 1e9;

          for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              var nx = x + dx * step;
              var ny = y + dy * step;
              if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
              var ni = ny * GW + nx;
              var ns = nearS[ni];
              if (ns < 0) continue;
              var d = (x - nearX[ni]) * (x - nearX[ni]) + (y - nearY[ni]) * (y - nearY[ni]);
              if (d < bestD) {
                bestD = d;
                bestS = ns;
                bestX = nearX[ni];
                bestY = nearY[ni];
              }
            }
          }

          nextS[y * GW + x] = bestS;
          nextX[y * GW + x] = bestX;
          nextY[y * GW + x] = bestY;
        }
      }

      nearS = nextS; nearX = nextX; nearY = nextY;
      usedStep = step;
      step = Math.max(1, step >> 1);
    }
    stepNowEl.textContent = String(usedStep);
  }

  function render() {
    var d = img.data;
    var p = 0;
    var maxD = 1;

    for (var y = 0; y < GH; y++) {
      for (var x = 0; x < GW; x++) {
        var i = y * GW + x;
        var s = nearS[i];
        if (s < 0) {
          d[p] = 6; d[p + 1] = 8; d[p + 2] = 14; d[p + 3] = 255;
          p += 4;
          continue;
        }
        var dx = x - nearX[i];
        var dy = y - nearY[i];
        var dist = Math.sqrt(dx * dx + dy * dy);

        var hue = seeds[s] ? seeds[s].hue : 0;
        var band = Math.abs(((dist * 0.6) % 1) - 0.5) * 2;
        var shade = 0.35 + 0.5 * (1 - Math.min(1, dist / 30)) + 0.15 * band;

        var rgb = hsl(hue, 62, 20 + shade * 45);
        d[p] = rgb[0]; d[p + 1] = rgb[1]; d[p + 2] = rgb[2]; d[p + 3] = 255;
        p += 4;
        if (dist > maxD) maxD = dist;
      }
    }

    maxDistEl.textContent = maxD.toFixed(1);
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, W, H);

    // 種
    for (var k = 0; k < seeds.length; k++) {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath();
      ctx.arc(seeds[k].x * CW, seeds[k].y * CH, 2.6, 0, 6.283);
      ctx.fill();
    }
  }

  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    var c = (1 - Math.abs(2 * l / 100 - 1)) * s / 100;
    var hp = h / 60;
    var x = c * (1 - Math.abs(hp % 2 - 1));
    var r = 0, g = 0, b = 0;
    if (hp < 1) { r = c; g = x; }
    else if (hp < 2) { r = x; g = c; }
    else if (hp < 3) { g = c; b = x; }
    else if (hp < 4) { g = x; b = c; }
    else if (hp < 5) { r = x; b = c; }
    else { r = c; b = x; }
    var m = l / 100 - c / 2;
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }

  var frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) fpsTimer = now;

    var t0 = performance.now();
    runJFA();
    render();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    msEl.textContent = smooth.toFixed(1) + " ms / " + GW + "×" + GH;
    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  passesEl.addEventListener("input", function () { passes = Number(passesEl.value); passesVal.textContent = String(passes); });
  seedsEl.addEventListener("input", function () {
    nSeeds = Number(seedsEl.value);
    seedsVal.textContent = String(nSeeds);
    initSeeds();
  });
  document.getElementById("shuffle").addEventListener("click", initSeeds);

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    var x = Math.floor((e.clientX - rect.left) / rect.width * GW);
    var y = Math.floor((e.clientY - rect.top) / rect.height * GH);
    if (x < 0 || y < 0 || x >= GW || y >= GH) return;
    seeds.push({ x: x, y: y, hue: Math.random() * 360 });
    nSeeds = seeds.length;
    seedsEl.value = String(Math.min(60, nSeeds));
    seedsVal.textContent = String(nSeeds);
  });

  initSeeds();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
