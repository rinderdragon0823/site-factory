<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レイマーチング — 距離を聞きながら、進む。</title>
<meta name="description" content="SDFレイマーチングの可視化。距離関数の値だけを頼りに光線を進めて、形を見つけます。">
<meta property="og:title" content="レイマーチング — 距離を聞きながら、進む。">
<meta property="og:description" content="「今の場所から一番近い面まであと何センチ」を聞いて、その分だけ進む。それだけで形が出ます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/raymarch-sdf/">
<meta property="og:site_name" content="レイマーチング">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --cyan:#67e8f9;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #0f2633 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #1a1430 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:720px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--cyan);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #view{display:block;width:100%;height:auto}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:112px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--cyan);min-width:0;cursor:pointer}
  .row output{width:64px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--cyan)}
  .actions button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">RAYMARCHING / SDF</p>
      <h1>レイマーチング</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms / 200×140</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="720" height="480" role="img" aria-label="SDFで描いた立体"></canvas>
  </div>

  <div class="panel">
    <div class="row"><label for="blend">なじませ具合</label><input id="blend" type="range" min="0.02" max="0.6" step="0.01" value="0.22"><output id="blendVal">0.22</output></div>
    <div class="row"><label for="spin">回転の速さ</label><input id="spin" type="range" min="0" max="1.2" step="0.05" value="0.35"><output id="spinVal">0.35</output></div>
    <div class="row"><label for="steps">ステップ数</label><input id="steps" type="range" min="16" max="96" step="4" value="56"><output id="stepsVal">56</output></div>
  </div>

  <div class="actions">
    <button type="button" id="pause">停止</button>
  </div>

  <p class="note">
    <b>各画素の光線を、距離関数の返す「一番近い面までの距離」だけ進める</b>。これを繰り返すと、形の表面に当たります。
    球と箱を smooth min でなじませると、つながった形に見えます。法線は距離関数の勾配から求め、影は影用の光線を短く飛ばして判定しています。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 720, H = 480;
  var RW = 200, RH = 140;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var off = document.createElement("canvas");
  off.width = RW;
  off.height = RH;
  var octx = off.getContext("2d");
  var img = octx.createImageData(RW, RH);

  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var blendEl = document.getElementById("blend");
  var spinEl = document.getElementById("spin");
  var stepsEl = document.getElementById("steps");
  var blendVal = document.getElementById("blendVal");
  var spinVal = document.getElementById("spinVal");
  var stepsVal = document.getElementById("stepsVal");

  var blend = 0.22;
  var spin = 0.35;
  var maxSteps = 56;
  var time = 0;
  var running = true;

  function smin(a, b, k) {
    var h = Math.max(0, Math.min(1, 0.5 + 0.5 * (b - a) / k));
    return b * (1 - h) + a * h - k * h * (1 - h);
  }

  function scene(px, py, pz) {
    var a = time * spin;
    var ca = Math.cos(a), sa = Math.sin(a);
    var x = px * ca - pz * sa;
    var z = px * sa + pz * ca;

    // 球
    var sphere = Math.sqrt(x * x + py * py + z * z) - 0.75;

    // 回転した箱
    var bx = Math.abs(x) - 0.55;
    var by = Math.abs(py) - 0.55;
    var bz = Math.abs(z) - 0.55;
    var box = Math.max(bx, Math.max(by, bz));

    var d = smin(sphere, box, blend);

    // 床
    var plane = py + 1.05;
    return Math.min(d, plane);
  }

  function normal(x, y, z) {
    var e = 0.002;
    var dx = scene(x + e, y, z) - scene(x - e, y, z);
    var dy = scene(x, y + e, z) - scene(x, y - e, z);
    var dz = scene(x, y, z + e) - scene(x, y, z - e);
    var l = Math.hypot(dx, dy, dz) || 1;
    return [dx / l, dy / l, dz / l];
  }

  function render() {
    var d = img.data;
    var p = 0;

    var camZ = 3.2;
    var fov = 1.2;

    for (var y = 0; y < RH; y++) {
      for (var x = 0; x < RW; x++) {
        var nx = (x / RW - 0.5) * 2 * (RW / RH) * fov * 0.5;
        var ny = -(y / RH - 0.5) * fov;

        var rx = nx, ry = ny, rz = -1;
        var rl = Math.hypot(rx, ry, rz);
        rx /= rl; ry /= rl; rz /= rl;

        var ox = 0, oy = 0.2, oz = camZ;
        var t = 0.0;
        var hit = false;

        for (var s = 0; s < maxSteps; s++) {
          var dist = scene(ox + rx * t, oy + ry * t, oz + rz * t);
          if (dist < 0.002) { hit = true; break; }
          t += dist;
          if (t > 8) break;
        }

        var r = 6, g = 8, b = 14;

        if (hit) {
          var hx = ox + rx * t, hy = oy + ry * t, hz = oz + rz * t;
          var n = normal(hx, hy, hz);

          var lx = 0.6, ly = 0.8, lz = 0.5;
          var ll = Math.hypot(lx, ly, lz);
          lx /= ll; ly /= ll; lz /= ll;

          var diff = Math.max(0, n[0] * lx + n[1] * ly + n[2] * lz);

          // 簡易ソフトシャドウ
          var sh = 1;
          var sx2 = hx + n[0] * 0.02, sy2 = hy + n[1] * 0.02, sz2 = hz + n[2] * 0.02;
          var st = 0.05;
          for (var k = 0; k < 12; k++) {
            var sd = scene(sx2 + lx * st, sy2 + ly * st, sz2 + lz * st);
            if (sd < 0.002) { sh = 0; break; }
            sh = Math.min(sh, 10 * sd / st);
            st += Math.max(0.02, sd);
            if (st > 2) break;
          }
          sh = Math.max(0, Math.min(1, sh));

          var rim = Math.pow(1 - Math.max(0, n[2] * -1), 2);
          var base = 0.08 + 0.9 * diff * sh;

          r = 18 + base * 120 + rim * 60;
          g = 30 + base * 130 + rim * 80;
          b = 60 + base * 150 + rim * 100;
        } else {
          // 背景グラデーション
          var bg = (y / RH);
          r = 6 + bg * 18;
          g = 8 + bg * 26;
          b = 18 + bg * 40;
        }

        d[p] = Math.min(255, r);
        d[p + 1] = Math.min(255, g);
        d[p + 2] = Math.min(255, b);
        d[p + 3] = 255;
        p += 4;
      }
    }

    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, W, H);
  }

  var last = 0, frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) { fpsTimer = now; last = now; }
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    var t0 = performance.now();
    if (running) time += dt;
    render();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    msEl.textContent = smooth.toFixed(1) + " ms / " + RW + "×" + RH;
    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  blendEl.addEventListener("input", function () { blend = Number(blendEl.value); blendVal.textContent = blend.toFixed(2); });
  spinEl.addEventListener("input", function () { spin = Number(spinEl.value); spinVal.textContent = spin.toFixed(2); });
  stepsEl.addEventListener("input", function () { maxSteps = Number(stepsEl.value); stepsVal.textContent = String(maxSteps); });

  document.getElementById("pause").addEventListener("click", function () {
    running = !running;
    this.textContent = running ? "停止" : "再開";
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
