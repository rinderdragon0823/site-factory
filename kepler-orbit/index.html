<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ケプラー軌道 — 近づくと、速くなる。</title>
<meta name="description" content="ケプラーの楕円軌道を可視化。離心率を変えると、近日点で速く、遠日点で遅い動きが見えます。">
<meta property="og:title" content="ケプラー軌道 — 近づくと、速くなる。">
<meta property="og:description" content="惑星は楕円を進み、太陽に近いほど速い。ケプラー方程式を解いて動かしています。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/kepler-orbit/">
<meta property="og:site_name" content="ケプラー軌道">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --gold:#fbbf24;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #2a2110 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #101a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--gold);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #view{display:block;width:100%;height:auto}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:112px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--gold);min-width:0;cursor:pointer}
  .row output{width:66px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .readout{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--muted)}
  .readout b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--gold)}
  .actions button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">KEPLER / ELLIPTICAL ORBIT</p>
      <h1>ケプラー軌道</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="720" height="480" role="img" aria-label="楕円軌道を回る惑星"></canvas>
  </div>

  <div class="panel">
    <div class="row"><label for="ecc">離心率</label><input id="ecc" type="range" min="0" max="0.85" step="0.01" value="0.45"><output id="eccVal">0.45</output></div>
    <div class="row"><label for="period">周期（秒）</label><input id="period" type="range" min="2" max="14" step="0.5" value="6"><output id="periodVal">6.0</output></div>
    <div class="readout">
      <span>近日点速度 <b id="vPeri">0</b></span>
      <span>遠日点速度 <b id="vApo">0</b></span>
      <span>いまの速度 <b id="vNow">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="pause">停止</button>
    <button type="button" id="reset">リセット</button>
  </div>

  <p class="note">
    <b>ケプラー方程式 M = E − e sin E を解いて位置を出しています</b>。太陽は楕円の焦点にあり、惑星は近日点で速く、遠日点で遅くなります。
    離心率を上げるほど、細長い軌道になります（e=0 なら円）。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 720, H = 480;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var vPeriEl = document.getElementById("vPeri");
  var vApoEl = document.getElementById("vApo");
  var vNowEl = document.getElementById("vNow");
  var eccEl = document.getElementById("ecc");
  var periodEl = document.getElementById("period");
  var eccVal = document.getElementById("eccVal");
  var periodVal = document.getElementById("periodVal");

  var e = 0.45;
  var period = 6;
  var t = 0;          // 平均近点角 (0..2π)
  var running = true;
  var trail = [];

  var A = 1;          // 半長軸
  var GM = 1;

  function solveKepler(M, ecc) {
    var E = M;
    for (var i = 0; i < 8; i++) {
      E = E - (E - ecc * Math.sin(E) - M) / (1 - ecc * Math.cos(E));
    }
    return E;
  }

  function stateAt(M) {
    var E = solveKepler(M, e);
    var cosE = Math.cos(E);
    var nu = Math.atan2(Math.sqrt(1 - e * e) * Math.sin(E), cosE - e);
    var r = A * (1 - e * cosE);
    return {
      x: r * Math.cos(nu),
      y: r * Math.sin(nu),
      r: r,
      nu: nu
    };
  }

  function scaleX(x) { return W / 2 + x * 150; }
  function scaleY(y) { return H / 2 + y * 150; }

  function draw() {
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, W, H);

    // 軌道
    ctx.strokeStyle = "rgba(233,239,248,.18)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var i = 0; i <= 240; i++) {
      var M = i / 240 * Math.PI * 2;
      var s = stateAt(M);
      var px = scaleX(s.x), py = scaleY(s.y);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // 太陽
    var sx = scaleX(0), sy = scaleY(0);
    var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 40);
    g.addColorStop(0, "rgba(255,220,140,0.9)");
    g.addColorStop(0.4, "rgba(251,191,36,0.35)");
    g.addColorStop(1, "rgba(251,191,36,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, 40, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = "#fde68a";
    ctx.beginPath();
    ctx.arc(sx, sy, 9, 0, 6.283);
    ctx.fill();

    // 軌跡
    if (trail.length > 1) {
      ctx.strokeStyle = "rgba(103,232,249,.5)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var k = 0; k < trail.length; k++) {
        var p = trail[k];
        if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    }

    // 惑星
    var st = stateAt(t);
    var x = scaleX(st.x), y = scaleY(st.y);

    ctx.fillStyle = "#67e8f9";
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, 6.283);
    ctx.fill();

    trail.push([x, y]);
    if (trail.length > 900) trail.shift();

    // 速度
    var rPeri = A * (1 - e);
    var rApo = A * (1 + e);
    var vPeri = Math.sqrt(GM * (2 / rPeri - 1 / A));
    var vApo = Math.sqrt(GM * (2 / rApo - 1 / A));
    var vNow = Math.sqrt(GM * (2 / st.r - 1 / A));

    vPeriEl.textContent = vPeri.toFixed(2);
    vApoEl.textContent = vApo.toFixed(2);
    vNowEl.textContent = vNow.toFixed(2);
  }

  var last = 0, frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) { fpsTimer = now; last = now; }
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    var t0 = performance.now();
    if (running) {
      t += (Math.PI * 2 / period) * dt;
      if (t > Math.PI * 2) t -= Math.PI * 2;
    }
    draw();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      msEl.textContent = smooth.toFixed(1) + " ms";
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  eccEl.addEventListener("input", function () {
    e = Number(eccEl.value);
    eccVal.textContent = e.toFixed(2);
    trail = [];
  });
  periodEl.addEventListener("input", function () {
    period = Number(periodEl.value);
    periodVal.textContent = period.toFixed(1);
  });

  document.getElementById("pause").addEventListener("click", function () {
    running = !running;
    this.textContent = running ? "停止" : "再開";
  });
  document.getElementById("reset").addEventListener("click", function () {
    t = 0;
    trail = [];
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
