<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>振り子の波 — 少しずつ違う周期が、波になる。</title>
<meta name="description" content="振り子の波のデモ。長さを少しずつ変えた振り子を並べると、位相のずれが波になって見えます。">
<meta property="og:title" content="振り子の波 — 少しずつ違う周期が、波になる。">
<meta property="og:description" content="周期がほんの少し違う振り子を並べるだけで、うねりが生まれます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/pendulum-wave/">
<meta property="og:site_name" content="振り子の波">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --teal:#5eead4;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #0d2a33 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #1a1430 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--teal);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #view{display:block;width:100%;height:auto}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:112px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--teal);min-width:0;cursor:pointer}
  .row output{width:66px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--teal)}
  .actions button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">PENDULUM WAVE</p>
      <h1>振り子の波</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 s</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="720" height="460" role="img" aria-label="振り子の波"></canvas>
  </div>

  <div class="panel">
    <div class="row"><label for="count">振り子の数</label><input id="count" type="range" min="8" max="36" step="1" value="24"><output id="countVal">24</output></div>
    <div class="row"><label for="spread">長さの差</label><input id="spread" type="range" min="1" max="12" step="0.5" value="9"><output id="spreadVal">9.0</output></div>
    <div class="row"><label for="amp">振り幅</label><input id="amp" type="range" min="0.05" max="0.55" step="0.01" value="0.50"><output id="ampVal">0.50</output></div>
    <div class="row"><label for="rate">時間の速さ</label><input id="rate" type="range" min="0.2" max="2" step="0.05" value="1"><output id="rateVal">1.00</output></div>
  </div>

  <div class="actions">
    <button type="button" id="pause">停止</button>
    <button type="button" id="reset">最初から</button>
  </div>

  <p class="note">
    <b>振り子の周期は T = 2π√(L/g)</b>。長さを少しずつ変えると周期が少しずつずれ、そろってスタートした振り子が少しずつ位相を変えます。
    そのずれが、ゆっくり流れる波として見えます。しばらくすると、また揃います。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 720, H = 460;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var countEl = document.getElementById("count");
  var spreadEl = document.getElementById("spread");
  var ampEl = document.getElementById("amp");
  var rateEl = document.getElementById("rate");
  var countVal = document.getElementById("countVal");
  var spreadVal = document.getElementById("spreadVal");
  var ampVal = document.getElementById("ampVal");
  var rateVal = document.getElementById("rateVal");

  var G = 1200;
  var N = 24;
  var spread = 9;
  var amp = 0.50;
  var rate = 1;
  var t = 0;
  var running = true;

  var ANCHOR_Y = 46;
  var TOP_MARGIN = 24;
  var X0 = 40, X1 = W - 40;

  function reset() { t = 0; }

  function draw() {
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, W, H);

    // 支点の梁
    ctx.fillStyle = "rgba(233,239,248,.16)";
    ctx.fillRect(X0 - 10, ANCHOR_Y - 6, (X1 - X0) + 20, 6);

    var step = (X1 - X0) / Math.max(1, N - 1);
    var baseL = Math.min(300, H - ANCHOR_Y - 70);

    var bobs = [];

    for (var i = 0; i < N; i++) {
      var ax = X0 + i * step;
      var L = baseL - (N - 1 - i) * spread * 1.2;
      if (L < 60) L = 60;

      var period = 2 * Math.PI * Math.sqrt(L / G);
      var theta = amp * Math.cos(2 * Math.PI * t / period);

      var bx = ax + Math.sin(theta) * L;
      var by = ANCHOR_Y + Math.cos(theta) * L;

      bobs.push({ x: bx, y: by, i: i });

      // 糸
      ctx.strokeStyle = "rgba(233,239,248,.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(ax, ANCHOR_Y);
      ctx.lineTo(bx, by);
      ctx.stroke();

      // おもり
      var hue = 160 + (i / Math.max(1, N - 1)) * 140;
      ctx.fillStyle = "hsl(" + hue.toFixed(0) + ",75%,62%)";
      ctx.beginPath();
      ctx.arc(bx, by, 5.5, 0, 6.283);
      ctx.fill();
    }

    // おもりを結ぶ線（波として見える）
    ctx.strokeStyle = "rgba(94,234,212,.55)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (var k = 0; k < bobs.length; k++) {
      if (k === 0) ctx.moveTo(bobs[k].x, bobs[k].y);
      else ctx.lineTo(bobs[k].x, bobs[k].y);
    }
    ctx.stroke();

    msEl.textContent = t.toFixed(1) + " s";
  }

  var last = 0, frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) { fpsTimer = now; last = now; }
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    var t0 = performance.now();
    if (running) t += dt * rate;
    draw();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  countEl.addEventListener("input", function () { N = Number(countEl.value); countVal.textContent = String(N); });
  spreadEl.addEventListener("input", function () { spread = Number(spreadEl.value); spreadVal.textContent = spread.toFixed(1); });
  ampEl.addEventListener("input", function () { amp = Number(ampEl.value); ampVal.textContent = amp.toFixed(2); });
  rateEl.addEventListener("input", function () { rate = Number(rateEl.value); rateVal.textContent = rate.toFixed(2); });

  document.getElementById("pause").addEventListener("click", function () {
    running = !running;
    this.textContent = running ? "停止" : "再開";
  });
  document.getElementById("reset").addEventListener("click", reset);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
