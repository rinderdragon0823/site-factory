<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アスキー絵師 — 絵文字が、文字の絵になる。</title>
<meta name="description" content="絵文字を選ぶだけで、その絵がアスキーアートに変換されます。色つきにも、あらくも、こまかくもできます。">
<meta property="og:title" content="アスキー絵師 — 絵文字が、文字の絵になる。">
<meta property="og:description" content="🐱 を選ぶと、文字だけで描かれた猫があらわれます。コピーしてそのまま貼れます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/emoji-ascii/">
<meta property="og:site_name" content="アスキー絵師">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#080d09">
<style>
  :root{
    --bg:#080d09;
    --panel:#0c1410;
    --green:#9dff9a;
    --dim:#5f8c63;
    --line:rgba(157,255,154,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(800px 460px at 90% -10%, #12251a 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #101d16 0%, transparent 55%),
      var(--bg);
    color:var(--green);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
  .kicker{margin:0;font-size:10px;letter-spacing:.3em;color:var(--dim);font-weight:800}
  h1{margin:.26em 0 .1em;font-size:clamp(1.8rem,7vw,2.5rem);letter-spacing:-.02em;line-height:1.08;color:#d8ffd4}
  .lead{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.65}

  .screen{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 12px;
    box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 60px rgba(60,255,120,.04);
    overflow:hidden;
  }
  .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    opacity:.35;
  }
  #art{
    margin:0;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
    line-height:1.02;
    letter-spacing:0;
    white-space:pre;
    overflow:hidden;
    color:var(--green);
    text-shadow:0 0 6px rgba(120,255,140,.35);
    min-height:180px;
  }
  #art .c{text-shadow:none}

  .emojirow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .emojirow button{
    flex:0 0 auto;
    width:52px;height:52px;border-radius:14px;
    font-size:26px;line-height:1;
    background:#0f1a12;border:1.5px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s,border-color .15s,background .15s;
    filter:grayscale(.35);
  }
  .emojirow button:hover{transform:translateY(-2px);border-color:var(--green);filter:none}
  .emojirow button:active{transform:translateY(0)}
  .emojirow button.on{border-color:var(--green);background:#14251a;filter:none;box-shadow:0 0 0 2px rgba(157,255,154,.18)}
  .emojirow button:focus-visible{outline:3px solid var(--green);outline-offset:2px}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .controls button{
    font:inherit;font-size:12px;font-weight:800;letter-spacing:.04em;
    color:var(--green);background:transparent;
    border:1.5px solid var(--line);border-radius:999px;
    padding:9px 14px;min-height:40px;cursor:pointer;
    transition:border-color .15s,background .15s,color .15s;
  }
  .controls button:hover{border-color:var(--green)}
  .controls button[aria-pressed="true"]{background:var(--green);color:#08110a;border-color:var(--green)}
  .controls button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  .controls .copy{margin-left:auto;border-color:var(--green)}

  .status{margin:10px 0 0;font-size:11px;color:var(--dim);min-height:1.3em;letter-spacing:.04em}
  .note{margin-top:10px;font-size:10.5px;color:rgba(157,255,154,.38);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">EMOJI → ASCII</p>
  <h1>アスキー絵師</h1>
  <p class="lead">絵文字を選ぶと、その絵が文字だけで描き直されます。色つきにも、あらくもできます。</p>

  <section class="screen" aria-label="アスキーアート">
    <pre id="art" aria-live="polite"></pre>
  </section>

  <div class="emojirow" id="emojis" role="group" aria-label="絵文字を選ぶ"></div>

  <div class="controls">
    <button type="button" id="coarse" aria-pressed="false">あらく</button>
    <button type="button" id="fine" aria-pressed="false">こまかく</button>
    <button type="button" id="color" aria-pressed="false">カラー</button>
    <button type="button" class="copy" id="copy">コピー</button>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <p class="note">絵文字は端末のフォントで描いています。コピーすると、色なしのアスキーアートがクリップボードに入ります。</p>
</main>

<script>
(function () {
  "use strict";

  var EMOJIS = ["🐱", "🗻", "🌸", "🚀", "🍜", "🦊"];
  var CHARS = " .:-=+*#%@";
  var art = document.getElementById("art");
  var statusEl = document.getElementById("status");
  var state = { emoji: "🐱", density: 0.85, color: false };
  var lastPlain = "";
  var lastCols = 0;
  var lastRows = 0;
  var revealRaf = 0;
  var resizeTimer = 0;

  function srcCanvas(ch) {
    var c = document.createElement("canvas");
    c.width = 512;
    c.height = 512;
    var g = c.getContext("2d");
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = '400 380px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.fillText(ch, 256, 272);
    return c;
  }

  function colsFor() {
    var w = Math.max(240, art.parentElement.clientWidth - 24);
    var base = Math.max(34, Math.min(92, Math.floor(w / 7.4)));
    return Math.max(30, Math.min(100, Math.round(base * state.density)));
  }

  function build() {
    var cols = colsFor();
    var rows = Math.max(10, Math.round(cols * 0.56));
    var src = srcCanvas(state.emoji);
    var small = document.createElement("canvas");
    small.width = cols;
    small.height = rows;
    var sctx = small.getContext("2d");
    sctx.clearRect(0, 0, cols, rows);
    sctx.drawImage(src, 0, 0, cols, rows);
    var data = sctx.getImageData(0, 0, cols, rows).data;

    var lines = [];
    var plain = [];
    for (var y = 0; y < rows; y++) {
      var html = "";
      var text = "";
      for (var x = 0; x < cols; x++) {
        var i = (y * cols + x) * 4;
        var a = data[i + 3] / 255;
        var lum = (0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2]) / 255 * a;
        var idx = Math.min(CHARS.length - 1, Math.floor(lum * CHARS.length));
        var ch = CHARS.charAt(idx);
        if (ch === " ") {
          html += " ";
          text += " ";
        } else if (state.color && a > 0.2) {
          html += '<span class="c" style="color:rgb(' + data[i] + "," + data[i + 1] + "," + data[i + 2] + ')">' + ch + "</span>";
          text += ch;
        } else {
          html += ch;
          text += ch;
        }
      }
      lines.push(html + "\n");
      plain.push(text);
    }

    lastPlain = plain.join("\n");
    lastCols = cols;
    lastRows = rows;

    // 文字サイズを横幅に合わせる
    var width = art.parentElement.clientWidth - 24;
    var fs = Math.max(4.2, Math.min(13, width / (cols * 0.62)));
    art.style.fontSize = fs.toFixed(2) + "px";

    reveal(lines);
    statusEl.textContent = cols + " × " + rows + " 文字 ／ " + (state.color ? "カラー" : "モノクロ");
  }

  function reveal(lines) {
    cancelAnimationFrame(revealRaf);
    art.textContent = "";
    var i = 0;
    function step() {
      var chunk = lines.slice(i, i + 3);
      if (!chunk.length) return;
      art.insertAdjacentHTML("beforeend", chunk.join(""));
      i += 3;
      revealRaf = requestAnimationFrame(step);
    }
    step();
  }

  function setEmoji(ch, btn) {
    state.emoji = ch;
    document.querySelectorAll("#emojis button").forEach(function (b) {
      b.classList.toggle("on", b === btn);
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    build();
  }

  function buildEmojiRow() {
    var row = document.getElementById("emojis");
    EMOJIS.forEach(function (ch, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = ch;
      b.setAttribute("aria-label", "絵文字 " + ch + " をアスキーアートにする");
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { setEmoji(ch, b); });
      if (i === 0) {
        b.classList.add("on");
        b.setAttribute("aria-pressed", "true");
      }
      row.appendChild(b);
    });
  }

  var coarse = document.getElementById("coarse");
  var fine = document.getElementById("fine");

  function setDensity(v) {
    state.density = v;
    coarse.setAttribute("aria-pressed", v === 0.68 ? "true" : "false");
    fine.setAttribute("aria-pressed", v === 1.12 ? "true" : "false");
    build();
  }

  coarse.addEventListener("click", function () { setDensity(state.density === 0.68 ? 0.85 : 0.68); });
  fine.addEventListener("click", function () { setDensity(state.density === 1.12 ? 0.85 : 1.12); });

  var colorBtn = document.getElementById("color");
  colorBtn.addEventListener("click", function () {
    state.color = !state.color;
    colorBtn.setAttribute("aria-pressed", state.color ? "true" : "false");
    build();
  });

  document.getElementById("copy").addEventListener("click", function () {
    copyText(lastPlain).then(function (ok) {
      statusEl.textContent = ok ? "コピーしました。そのまま貼れます。" : "コピーできませんでした。";
      window.setTimeout(function () {
        statusEl.textContent = lastCols + " × " + lastRows + " 文字 ／ " + (state.color ? "カラー" : "モノクロ");
      }, 1800);
    });
  });

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(build, 220);
    }).observe(art.parentElement);
  } else {
    window.addEventListener("resize", build);
  }

  buildEmojiRow();
  build();
})();
</script>
</body>
</html>
