<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>粘菌 — 3方向を見て、曲がる。</title>
<meta name="description" content="粘菌（Physarum）モデルの可視化。何千もの粒がフェロモンをたどり、網目状の道を作ります。">
<meta property="og:title" content="粘菌 — 3方向を見て、曲がる。">
<meta property="og:description" content="前・左・右の匂いを比べて、濃い方へ曲がる。それだけで、道路網のような模様ができます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/physarum-slime/">
<meta property="og:site_name" content="粘菌">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#04070c">
<style>
  :root{
    --bg:#04070c;
    --panel:#0b1018;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --lime:#bef264;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #1b2a12 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #101a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--lime);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#02050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #view{display:block;width:100%;height:auto}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:112px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--lime);min-width:0;cursor:pointer}
  .row output{width:64px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0b1018;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--lime)}
  .actions button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">PHYSARUM / AGENT MODEL</p>
      <h1>粘菌</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms / 120,000 セル</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="400" height="300" role="img" aria-label="粘菌の網目模様"></canvas>
  </div>

  <div class="panel">
    <div class="row"><label for="agents">粒の数</label><input id="agents" type="range" min="500" max="4000" step="100" value="2500"><output id="agentsVal">2500</output></div>
    <div class="row"><label for="sensor">センサー角</label><input id="sensor" type="range" min="0.2" max="1.6" step="0.05" value="0.55"><output id="sensorVal">0.55</output></div>
    <div class="row"><label for="turn">曲がる角</label><input id="turn" type="range" min="0.05" max="0.9" step="0.02" value="0.32"><output id="turnVal">0.32</output></div>
    <div class="row"><label for="speed">進む速さ</label><input id="speed" type="range" min="0.4" max="2.2" step="0.05" value="1"><output id="speedVal">1.00</output></div>
    <div class="row"><label for="fade">消える速さ</label><input id="fade" type="range" min="0.01" max="0.25" step="0.01" value="0.08"><output id="fadeVal">0.08</output></div>
  </div>

  <div class="actions">
    <button type="button" id="clear">消す</button>
    <button type="button" id="pause">停止</button>
  </div>

  <p class="note">
    <b>各粒が前・左・右の3点の匂いを比べて、一番濃い方へ少し曲がり、通り道に匂いを置く</b>。匂いは拡散して薄まります。
    それだけなのに、太い道と網目が自然にできます。粘菌が最短経路を探す仕組みのモデルです。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 400, H = 300;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var img = ctx.createImageData(W, H);
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var agentsEl = document.getElementById("agents");
  var sensorEl = document.getElementById("sensor");
  var turnEl = document.getElementById("turn");
  var speedEl = document.getElementById("speed");
  var fadeEl = document.getElementById("fade");
  var agentsVal = document.getElementById("agentsVal");
  var sensorVal = document.getElementById("sensorVal");
  var turnVal = document.getElementById("turnVal");
  var speedVal = document.getElementById("speedVal");
  var fadeVal = document.getElementById("fadeVal");

  var MAXA = 4000;
  var N = 2500;
  var sensorAngle = 0.55;
  var turnAngle = 0.32;
  var moveSpeed = 1;
  var fade = 0.08;
  var running = true;

  var trail = new Float32Array(W * H);
  var trail2 = new Float32Array(W * H);
  var ax = new Float32Array(MAXA);
  var ay = new Float32Array(MAXA);
  var aa = new Float32Array(MAXA);

  function idx(x, y) {
    return ((y | 0) + H) % H * W + (((x | 0) + W) % W);
  }

  function spawn() {
    for (var i = 0; i < MAXA; i++) {
      ax[i] = Math.random() * W;
      ay[i] = Math.random() * H;
      aa[i] = Math.random() * Math.PI * 2;
    }
  }

  function clearAll() {
    trail.fill(0);
    trail2.fill(0);
    spawn();
  }

  function sense(x, y, ang) {
    var sx = x + Math.cos(ang) * 6;
    var sy = y + Math.sin(ang) * 6;
    return trail[idx(sx, sy)];
  }

  function step() {
    for (var i = 0; i < N; i++) {
      var x = ax[i], y = ay[i], a = aa[i];

      var f = sense(x, y, a);
      var l = sense(x, y, a - sensorAngle);
      var r = sense(x, y, a + sensorAngle);

      if (f > l && f > r) {
        // まっすぐ
      } else if (l > r) {
        a -= turnAngle;
      } else if (r > l) {
        a += turnAngle;
      } else {
        a += (Math.random() - 0.5) * turnAngle;
      }

      x += Math.cos(a) * moveSpeed;
      y += Math.sin(a) * moveSpeed;
      if (x < 0) x += W; else if (x >= W) x -= W;
      if (y < 0) y += H; else if (y >= H) y -= H;

      ax[i] = x; ay[i] = y; aa[i] = a;

      trail[idx(x, y)] += 1;
    }
  }

  function diffuse() {
    var d = 1 - fade;
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var i = y * W + x;
        var sum = trail[i] * 4;
        var n = 4;
        if (x > 0) { sum += trail[i - 1]; n++; }
        if (x < W - 1) { sum += trail[i + 1]; n++; }
        if (y > 0) { sum += trail[i - W]; n++; }
        if (y < H - 1) { sum += trail[i + W]; n++; }
        trail2[i] = (sum / n) * d;
      }
    }
    var t = trail; trail = trail2; trail2 = t;
  }

  function render() {
    var d = img.data;
    var p = 0;
    for (var i = 0; i < W * H; i++) {
      var v = trail[i];
      var t = Math.min(1, Math.log(1 + v * 1.6) / 2.2);
      var r = 20 + t * 190;
      var g = 40 + t * 215;
      var b = 30 + t * 120;
      d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = 255;
      p += 4;
    }
    ctx.putImageData(img, 0, 0);
  }

  var frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) fpsTimer = now;
    var t0 = performance.now();
    if (running) {
      step();
      diffuse();
    }
    render();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      msEl.textContent = smooth.toFixed(1) + " ms / " + (W * H).toLocaleString("en-US") + " セル";
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  agentsEl.addEventListener("input", function () { N = Number(agentsEl.value); agentsVal.textContent = String(N); });
  sensorEl.addEventListener("input", function () { sensorAngle = Number(sensorEl.value); sensorVal.textContent = sensorAngle.toFixed(2); });
  turnEl.addEventListener("input", function () { turnAngle = Number(turnEl.value); turnVal.textContent = turnAngle.toFixed(2); });
  speedEl.addEventListener("input", function () { moveSpeed = Number(speedEl.value); speedVal.textContent = moveSpeed.toFixed(2); });
  fadeEl.addEventListener("input", function () { fade = Number(fadeEl.value); fadeVal.textContent = fade.toFixed(2); });

  document.getElementById("clear").addEventListener("click", clearAll);
  document.getElementById("pause").addEventListener("click", function () {
    running = !running;
    this.textContent = running ? "停止" : "再開";
  });

  clearAll();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
