<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ベジェ — 線を、線で補間する。</title>
<meta name="description" content="ベジェ曲線とド・カステリョの作図。制御点をドラッグすると曲線が変わり、補間の過程がそのまま見えます。">
<meta property="og:title" content="ベジェ — 線を、線で補間する。">
<meta property="og:description" content="2点を結ぶ線分の上を、割合で動く点。それを何回か繰り返すと、曲線になります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/bezier-curves/">
<meta property="og:site_name" content="ベジェ">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --pink:#f9a8d4;
    --amber:#fbbf24;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #2a1430 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #101a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:720px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--pink);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55);touch-action:none}
  #view{display:block;width:100%;height:auto;cursor:grab}
  #view:active{cursor:grabbing}
  .hint{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(233,239,248,.45);pointer-events:none}

  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{
    flex:1 1 0;font:inherit;font-size:11.5px;font-weight:800;
    color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:999px;
    padding:9px 10px;min-height:38px;cursor:pointer;
  }
  .presets button:hover{color:var(--ink);border-color:var(--pink)}
  .presets button[aria-pressed="true"]{background:var(--pink);color:#2a0b1c;border-color:var(--pink)}
  .presets button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:104px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--pink);min-width:0;cursor:pointer}
  .row output{width:62px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">DE CASTELJAU</p>
      <h1>ベジェ</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0.0 ms / 0 px</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="640" height="480" role="img" aria-label="ベジェ曲線と作図"></canvas>
    <div class="hint">制御点をドラッグできます</div>
  </div>

  <div class="presets" role="group" aria-label="次数と表示">
    <button type="button" data-d="3" aria-pressed="true">3次</button>
    <button type="button" data-d="2" aria-pressed="false">2次</button>
    <button type="button" id="show" aria-pressed="true">作図を表示</button>
  </div>

  <div class="panel">
    <div class="row"><label for="t">t（位置）</label><input id="t" type="range" min="0" max="1" step="0.002" value="0.35"><output id="tVal">0.350</output></div>
    <div class="row"><label for="speed">自動で動く速さ</label><input id="speed" type="range" min="0" max="1.2" step="0.05" value="0.35"><output id="speedVal">0.35</output></div>
  </div>

  <p class="note">
    <b>2点の間を t:(1−t) で分ける点（線形補間）を、段数が減るまで繰り返す</b>のがド・カステリョの作図。最後に残った1点が、曲線上の点です。
    4つの制御点を動かすと、曲線がどう変わるか見てください。曲線の長さも測っています。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 640, H = 480;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var tEl = document.getElementById("t");
  var speedEl = document.getElementById("speed");
  var tVal = document.getElementById("tVal");
  var speedVal = document.getElementById("speedVal");

  var pts = [
    { x: 90, y: 360 },
    { x: 200, y: 80 },
    { x: 440, y: 80 },
    { x: 550, y: 360 }
  ];
  var degree = 3;
  var t = 0.35;
  var speed = 0.35;
  var show = true;
  var dragIdx = -1;
  var auto = true;

  function lerp(a, b, k) {
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
  }

  function pointAt(k) {
    var n = degree === 2 ? 3 : 4;
    var p = pts.slice(0, n);
    var levels = [p];
    while (p.length > 1) {
      var next = [];
      for (var i = 0; i < p.length - 1; i++) next.push(lerp(p[i], p[i + 1], k));
      levels.push(next);
      p = next;
    }
    return { point: p[0], levels: levels };
  }

  function draw() {
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, W, H);

    // グリッド
    ctx.strokeStyle = "rgba(233,239,248,.045)";
    ctx.lineWidth = 1;
    for (var gx = 0; gx < W; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (var gy = 0; gy < H; gy += 40) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    var n = degree === 2 ? 3 : 4;

    // 制御多角形
    ctx.strokeStyle = "rgba(233,239,248,.25)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
      else ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();

    // 曲線
    ctx.strokeStyle = "rgba(249,168,212,.95)";
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    var len = 0;
    var prev = null;
    for (var s = 0; s <= 120; s++) {
      var u = s / 120;
      var q = pointAt(u).point;
      if (prev) len += Math.hypot(q.x - prev.x, q.y - prev.y);
      if (s === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      prev = q;
    }
    ctx.stroke();

    // 作図
    var res = pointAt(t);
    if (show) {
      var colors = ["rgba(251,191,36,.9)", "rgba(196,181,253,.9)", "rgba(110,231,183,.95)"];
      for (var L = 1; L < res.levels.length; L++) {
        var arr = res.levels[L];
        ctx.strokeStyle = colors[(L - 1) % colors.length];
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (var j = 0; j < arr.length; j++) {
          if (j === 0) ctx.moveTo(arr[j].x, arr[j].y);
          else ctx.lineTo(arr[j].x, arr[j].y);
        }
        ctx.stroke();

        ctx.fillStyle = colors[(L - 1) % colors.length];
        for (var k2 = 0; k2 < arr.length; k2++) {
          ctx.beginPath();
          ctx.arc(arr[k2].x, arr[k2].y, 3.2, 0, 6.283);
          ctx.fill();
        }
      }
    }

    // 曲線上の点
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(res.point.x, res.point.y, 5, 0, 6.283);
    ctx.fill();

    // 接線
    var a = pointAt(Math.max(0, t - 0.01)).point;
    var b = pointAt(Math.min(1, t + 0.01)).point;
    var dx = b.x - a.x, dy = b.y - a.y;
    var dl = Math.hypot(dx, dy) || 1;
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(res.point.x - dx / dl * 120, res.point.y - dy / dl * 120);
    ctx.lineTo(res.point.x + dx / dl * 120, res.point.y + dy / dl * 120);
    ctx.stroke();
    ctx.setLineDash([]);

    // 制御点
    for (var m = 0; m < n; m++) {
      ctx.beginPath();
      ctx.arc(pts[m].x, pts[m].y, 8, 0, 6.283);
      ctx.fillStyle = m === 0 || m === n - 1 ? "rgba(249,168,212,.9)" : "rgba(233,239,248,.75)";
      ctx.fill();
      ctx.strokeStyle = "rgba(3,5,10,.8)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    msEl.textContent = (draw.lastMs || 0).toFixed(1) + " ms / " + Math.round(len) + " px";
    return len;
  }

  function loop(now) {
    if (!loop.timer) loop.timer = now;
    if (auto && dragIdx < 0) {
      t += speed * 0.008;
      if (t > 1) t = 0;
      tEl.value = String(t);
      tVal.textContent = t.toFixed(3);
    }
    var t0 = performance.now();
    draw();
    draw.lastMs = (draw.lastMs || 0) * 0.9 + (performance.now() - t0) * 0.1;

    loop.frames = (loop.frames || 0) + 1;
    if (now - loop.timer > 500) {
      fpsEl.textContent = String(Math.round(loop.frames * 1000 / (now - loop.timer)));
      loop.frames = 0;
      loop.timer = now;
    }
    requestAnimationFrame(loop);
  }

  function nearest(x, y) {
    var best = -1, bd = 26 * 26;
    for (var i = 0; i < pts.length; i++) {
      var dx = pts[i].x - x, dy = pts[i].y - y;
      var d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = i; }
    }
    return best;
  }

  function localPos(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * W,
      y: (e.clientY - rect.top) / rect.height * H
    };
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = localPos(e);
    var i = nearest(p.x, p.y);
    if (i >= 0) {
      dragIdx = i;
      if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (dragIdx < 0) return;
    var p = localPos(e);
    pts[dragIdx].x = Math.max(10, Math.min(W - 10, p.x));
    pts[dragIdx].y = Math.max(10, Math.min(H - 10, p.y));
  });

  function end() { dragIdx = -1; }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("pointerleave", end);

  document.querySelectorAll(".presets button[data-d]").forEach(function (b) {
    b.addEventListener("click", function () {
      degree = Number(b.getAttribute("data-d"));
      document.querySelectorAll(".presets button[data-d]").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
    });
  });

  document.getElementById("show").addEventListener("click", function () {
    show = !show;
    this.setAttribute("aria-pressed", show ? "true" : "false");
  });

  tEl.addEventListener("input", function () {
    t = Number(tEl.value);
    tVal.textContent = t.toFixed(3);
    auto = false;
  });
  speedEl.addEventListener("input", function () {
    speed = Number(speedEl.value);
    speedVal.textContent = speed.toFixed(2);
    auto = speed > 0;
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
