<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>反転ジャンプ — タップで重力をひっくり返せ。</title>
<meta name="description" content="タップで重力が反転する1ボタンゲーム。赤い壁の隙間をくぐって、どこまで進めるか。距離スコアと自己ベストつき。">
<meta property="og:title" content="反転ジャンプ — タップで重力をひっくり返せ。">
<meta property="og:description" content="タップするたび、重力が上下に反転。壁の隙間をくぐり続ける1ボタンゲーム。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/hanten-jump/">
<meta property="og:site_name" content="反転ジャンプ">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b1220">
<style>
  :root{
    --bg:#0b1220;
    --panel:#131b2c;
    --lime:#d9ff5a;
    --coral:#ff5d5d;
    --text:#eef2ea;
    --muted:rgba(238,242,234,.62);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 100% -10%, #17263f 0%, transparent 60%),
      radial-gradient(700px 420px at -10% 110%, #1a2b22 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    overscroll-behavior:none;
    display:flex;flex-direction:column;
  }
  .wrap{max-width:780px;margin:auto;width:100%;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 10px}
  .kicker{margin:0;font-size:10px;letter-spacing:.26em;color:var(--lime);font-weight:800}
  h1{margin:.18em 0 0;font-size:clamp(1.5rem,5.4vw,2rem);letter-spacing:-.02em;line-height:1.1}
  .tagline{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5;text-align:right}
  .stage{
    position:relative;width:100%;
    height:clamp(380px,66vh,680px);
    border-radius:18px;overflow:hidden;
    background:#0d1524;
    border:1px solid rgba(238,242,234,.12);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #game{display:block;width:100%;height:100%}
  .hud{
    position:absolute;inset:0;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 16px;
    font-variant-numeric:tabular-nums;
  }
  .hud .score{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;letter-spacing:-.03em;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .hud .score span{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--muted);font-weight:700;margin-bottom:4px}
  .hud .best{font-size:11px;color:var(--muted);text-align:right;letter-spacing:.06em}
  .hud .best b{display:block;font-size:16px;color:var(--text);letter-spacing:0}
  .demoTag{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-size:9.5px;font-weight:800;letter-spacing:.3em;
    color:var(--lime);border:1px solid rgba(217,255,90,.5);
    border-radius:999px;padding:4px 10px;pointer-events:none;
  }
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:18px;background:rgba(8,12,20,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    pointer-events:none;
  }
  .overlay.hidden{display:none}
  .panel{
    pointer-events:auto;
    width:100%;max-width:360px;text-align:center;
    background:var(--panel);
    border:1px solid rgba(238,242,234,.12);
    border-radius:16px;padding:20px 18px 18px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .panel .kicker{color:var(--coral)}
  .panel h2{margin:.3em 0 .2em;font-size:clamp(1.4rem,5.4vw,1.7rem);letter-spacing:-.02em}
  .panel p.desc{margin:0 0 14px;font-size:12.5px;line-height:1.7;color:var(--muted)}
  .panel button{
    width:100%;font:inherit;font-size:16px;font-weight:900;letter-spacing:.04em;
    color:#121a0d;background:var(--lime);border:0;border-radius:11px;
    padding:14px;min-height:52px;cursor:pointer;
    box-shadow:0 4px 0 #9fbe2f;transition:transform .08s,box-shadow .08s;
  }
  .panel button:active{transform:translateY(3px);box-shadow:0 1px 0 #9fbe2f}
  .panel button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .keys{margin:10px 0 0;font-size:10.5px;color:var(--muted)}
  .scoreBig{margin:6px 0 0;font-size:clamp(3rem,14vw,4rem);font-weight:900;line-height:1;color:var(--lime);letter-spacing:-.05em}
  .bestLine{margin:4px 0 14px;font-size:12px;color:var(--muted)}
  .bestLine b{color:var(--text);font-size:14px}
  .hint{margin:14px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.8}
  .hint b{color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">GRAVITY FLIP</p>
      <h1>反転ジャンプ</h1>
    </div>
    <p class="tagline">タップで重力が反転。<br>壁の隙間を、くぐり続けろ。</p>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="score"><span>SCORE</span><b id="score">0</b></div>
      <div class="best">BEST<b id="best">0</b></div>
    </div>
    <div class="demoTag" id="demoTag" hidden>DEMO ・ タップで参加</div>
    <div class="overlay" id="overlay">
      <div class="panel" id="panelStart">
        <p class="kicker">1 BUTTON GAME</p>
        <h2>タップで、反転。</h2>
        <p class="desc">重力が上下ひっくり返ります。赤い壁の隙間をくぐって、ひたすら前へ。</p>
        <button type="button" id="startBtn">スタート</button>
        <p class="keys">Space / 画面タップでもスタート</p>
      </div>
      <div class="panel" id="panelOver" hidden>
        <p class="kicker">GAME OVER</p>
        <p class="scoreBig" id="finalScore">0</p>
        <p class="bestLine">自己ベスト <b id="finalBest">0</b></p>
        <button type="button" id="retryBtn">もう一回</button>
      </div>
    </div>
  </div>

  <p class="hint">
    <b>タップ / クリック / Space</b> で重力反転。壁に当たると終了。画面を放置するとデモが流れます。
  </p>
</main>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var panelStart = document.getElementById("panelStart");
  var panelOver = document.getElementById("panelOver");
  var finalScore = document.getElementById("finalScore");
  var finalBest = document.getElementById("finalBest");
  var demoTag = document.getElementById("demoTag");

  var W = 600, H = 400, dpr = 1;
  var player = { x: 0, y: 0, vy: 0, size: 26, dir: 1 };
  var obstacles = [];
  var particles = [];
  var dist = 0;
  var speed = 300;
  var score = 0;
  var best = 0;
  var spawnAcc = 0;
  var lastOpen = true;
  var mode = "start";
  var shake = 0;
  var deadAt = 0;
  var attractStart = 0;
  var idleTimer = 0;
  var style = {};

  try { best = Number(window.localStorage.getItem("hanten_jump_best") || 0) || 0; } catch (e) { best = 0; }
  bestEl.textContent = String(best);

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function resize() {
    var rect = stage.getBoundingClientRect();
    W = Math.max(280, Math.round(rect.width));
    H = Math.max(240, Math.round(rect.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    player.x = Math.round(W * 0.24);
    player.y = clamp(player.y, 0, H - player.size);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#101a2d");
    g.addColorStop(0.55, "#0d1524");
    g.addColorStop(1, "#0a111c");
    style.bg = g;
    render();
  }

  function resetRun(nextMode) {
    obstacles = [];
    particles = [];
    dist = 0;
    speed = 300;
    score = 0;
    spawnAcc = 260;
    lastOpen = true;
    shake = 0;
    player.dir = 1;
    player.vy = 0;
    player.size = clamp(Math.round(W * 0.042), 20, 30);
    player.y = H - player.size;
    player.x = Math.round(W * 0.24);
    mode = nextMode;
    scoreEl.textContent = "0";
    overlay.classList.add("hidden");
    demoTag.hidden = nextMode !== "attract";
    if (nextMode === "attract") attractStart = performance.now();
  }

  function startRun() {
    resetRun("run");
    window.clearTimeout(idleTimer);
  }

  function startAttract() {
    if (mode !== "start") return;
    resetRun("attract");
  }

  function flip() {
    if (mode !== "run" && mode !== "attract") return;
    player.dir *= -1;
    player.vy = 0;
    for (var i = 0; i < 6; i++) {
      particles.push({
        x: player.x + player.size / 2,
        y: player.y + player.size / 2,
        vx: (Math.random() - 0.5) * 120,
        vy: (Math.random() - 0.5) * 120,
        life: 0.45,
        max: 0.45,
        size: 2 + Math.random() * 3,
        color: "217,255,90"
      });
    }
  }

  function spawn() {
    var gap = clamp(Math.round(H * 0.36), 140, 210);
    var openTop = !lastOpen;
    lastOpen = openTop;
    obstacles.push({ x: W + 40, openTop: openTop, gap: gap, scored: false });
  }

  function die() {
    if (mode === "dead") return;
    var wasRun = mode === "run";
    mode = "dead";
    deadAt = performance.now();
    shake = 16;
    for (var i = 0; i < 22; i++) {
      particles.push({
        x: player.x + player.size / 2,
        y: player.y + player.size / 2,
        vx: (Math.random() - 0.5) * 380,
        vy: (Math.random() - 0.5) * 380,
        life: 0.8,
        max: 0.8,
        size: 2 + Math.random() * 4,
        color: "255,93,93"
      });
    }
    if (wasRun) {
      if (score > best) {
        best = score;
        bestEl.textContent = String(best);
        try { window.localStorage.setItem("hanten_jump_best", String(best)); } catch (e) {}
      }
      window.setTimeout(function () {
        if (mode !== "dead") return;
        finalScore.textContent = String(score);
        finalBest.textContent = String(best);
        panelStart.hidden = true;
        panelOver.hidden = false;
        overlay.classList.remove("hidden");
      }, 480);
    }
  }

  function ai() {
    var px = player.x + player.size;
    var target = null;
    for (var i = 0; i < obstacles.length; i++) {
      if (obstacles[i].x + 44 > player.x) { target = obstacles[i]; break; }
    }
    if (!target) return;
    var onTop = player.dir === -1;
    var needTop = target.openTop;
    var gapX = target.x - px;
    var lead = speed * 0.78 + 40;
    if (needTop !== onTop && gapX < lead) flip();
  }

  function update(dt) {
    if (mode === "dead") {
      shake *= Math.pow(0.001, dt);
      updateParticles(dt);
      return;
    }
    if (mode !== "run" && mode !== "attract") return;

    speed = 300 + Math.min(320, dist * 0.028);
    dist += speed * dt;
    score = Math.floor(dist / 12);
    scoreEl.textContent = String(score);
    if (mode === "attract") ai();

    player.vy += 2100 * player.dir * dt;
    player.vy = clamp(player.vy, -1100, 1100);
    player.y += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; }
    if (player.y >= H - player.size) { player.y = H - player.size; player.vy = 0; }

    spawnAcc -= speed * dt;
    if (spawnAcc <= 0) {
      spawn();
      spawnAcc = 340 + Math.random() * 130;
    }

    for (var i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= speed * dt;
      if (o.x < -80) obstacles.splice(i, 1);
    }

    updateParticles(dt);

    if (collides()) die();
  }

  function collides() {
    var px = player.x, py = player.y, ps = player.size;
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      var wx = o.x, ww = 44;
      var wy = o.openTop ? o.gap : 0;
      var wh = H - o.gap;
      if (px + ps > wx && px < wx + ww && py + ps > wy && py < wy + wh) return true;
    }
    return false;
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 900 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    ctx.fillStyle = style.bg || "#0d1524";
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 背景の流れるライン
    ctx.strokeStyle = "rgba(238,242,234,.055)";
    ctx.lineWidth = 1;
    var off = (dist * 0.5) % 64;
    for (var y = -64 + off; y < H + 64; y += 64) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // 障害物
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      var wy = o.openTop ? o.gap : 0;
      var wh = H - o.gap;
      ctx.fillStyle = "#ff5d5d";
      ctx.fillRect(o.x, wy, 44, wh);
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.fillRect(o.x + 34, wy, 10, wh);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fillRect(o.x, wy, 4, wh);
    }

    // パーティクル
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.fillStyle = "rgba(" + p.color + "," + Math.max(0, p.life / p.max).toFixed(2) + ")";
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    // プレイヤー
    if (mode !== "dead") {
      ctx.save();
      ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
      ctx.rotate(clamp(player.vy * 0.00035, -0.3, 0.3));
      ctx.shadowColor = "rgba(217,255,90,.85)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#d9ff5a";
      roundRect(-player.size / 2, -player.size / 2, player.size, player.size, 7);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(11,18,32,.75)";
      ctx.fillRect(-3, -3, 6, 6);
      ctx.restore();
    }

    ctx.restore();
  }

  var last = 0;
  function loop(now) {
    if (!last) last = now;
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    if (mode === "dead" && demoTag.hidden === false && performance.now() - deadAt > 900) {
      resetRun("attract");
    }
    render();
    requestAnimationFrame(loop);
  }

  function onFlipInput() {
    if (mode === "start") { startRun(); return; }
    if (mode === "attract") { startRun(); return; }
    if (mode === "dead") { startRun(); return; }
    if (mode === "run") flip();
  }

  canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); onFlipInput(); }, { passive: false });
  document.getElementById("startBtn").addEventListener("click", startRun);
  document.getElementById("retryBtn").addEventListener("click", startRun);

  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "ArrowUp" || e.key === "Enter") {
      if (e.target && (e.target.tagName === "BUTTON" || e.target.tagName === "A")) return;
      e.preventDefault();
      if (mode === "start") startRun();
      else onFlipInput();
    }
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener("resize", resize);

  resize();
  resetRun("start");
  overlay.classList.remove("hidden");
  panelStart.hidden = false;
  panelOver.hidden = true;

  idleTimer = window.setTimeout(startAttract, 2600);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
