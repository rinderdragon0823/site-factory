<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WFC — まだ決まっていないマスから、決めていく。</title>
<meta name="description" content="Wave Function Collapse の可視化。各マスが持つ候補を、となりの制約で削っていき、最後に1つに決まる様子を見られます。">
<meta property="og:title" content="WFC — まだ決まっていないマスから、決めていく。">
<meta property="og:description" content="候補を全部持たせておいて、つながる組み合わせだけ残す。それだけで模様が立ち上がります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/wfc-tiles/">
<meta property="og:site_name" content="WFC">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --violet:#c4b5fd;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #221b3a 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #10222a 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--violet);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.4rem,5.2vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #grid{display:block;width:100%;height:auto}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:104px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--violet);min-width:0;cursor:pointer}
  .row output{width:64px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .readout{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--muted)}
  .readout b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--violet)}
  .actions button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">WAVE FUNCTION COLLAPSE</p>
      <h1>WFC</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0 マス未決定</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="grid" width="640" height="416" role="img" aria-label="WFCで生成中のタイル"></canvas>
  </div>

  <div class="panel">
    <div class="row"><label for="speed">1手の間隔</label><input id="speed" type="range" min="20" max="400" step="10" value="60"><output id="speedVal">60ms</output></div>
    <div class="readout">
      <span>決定 <b id="done">0</b></span>
      <span>再起動 <b id="restarts">0</b></span>
      <span>状態 <b id="state">生成中</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="again">もう一度</button>
    <button type="button" id="pause">停止</button>
  </div>

  <p class="note">
    <b>全マスに「候補4つ」を持たせ、1マスをランダムに決める</b>。すると隣のマスで、つながらない候補が消え、それが連鎖します。
    候補が尽きたら矛盾なので、最初からやり直し。これを繰り返すと、パイプがつながった模様になります。
  </p>
</main>

<script>
(function () {
  "use strict";

  var COLS = 40, ROWS = 26, CELL = 16;
  var canvas = document.getElementById("grid");
  var ctx = canvas.getContext("2d", { alpha: false });
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var doneEl = document.getElementById("done");
  var restartsEl = document.getElementById("restarts");
  var stateEl = document.getElementById("state");
  var speedEl = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");

  // 0:h 1:v 2:x 3:empty  sides: L,R,U,D
  var TILES = [
    { L: 1, R: 1, U: 0, D: 0, color: "#5eead4" }, // 横
    { L: 0, R: 0, U: 1, D: 1, color: "#7dd3fc" }, // 縦
    { L: 0, R: 1, U: 1, D: 0, color: "#a7f3d0" }, // 右上
    { L: 1, R: 0, U: 1, D: 0, color: "#a7f3d0" }, // 左上
    { L: 0, R: 1, U: 0, D: 1, color: "#a7f3d0" }, // 右下
    { L: 1, R: 0, U: 0, D: 1, color: "#a7f3d0" }, // 左下
    { L: 1, R: 1, U: 1, D: 1, color: "#c4b5fd" }, // 十字
  ];
  var FULL = (1 << TILES.length) - 1;

  // compat[dir][tile] = その方向に置いてよいタイルのビット
  var DIRS = [[-1, 0, "L", "R"], [1, 0, "R", "L"], [0, -1, "U", "D"], [0, 1, "D", "U"]];
  var compat = [];

  (function buildCompat() {
    for (var d = 0; d < 4; d++) {
      var arr = new Array(TILES.length).fill(0);
      for (var a = 0; a < TILES.length; a++) {
        for (var b = 0; b < TILES.length; b++) {
          if (TILES[a][DIRS[d][2]] === TILES[b][DIRS[d][3]]) arr[a] |= (1 << b);
        }
      }
      compat.push(arr);
    }
  })();

  // maskTable[d][domainMask] = 隣に許されるタイルのビット
  var maskTable = [];
  (function buildMaskTable() {
    for (var d = 0; d < 4; d++) {
      var t = new Uint16Array(FULL + 1);
      for (var m = 0; m <= FULL; m++) {
        var allowed = 0;
        for (var a = 0; a < TILES.length; a++) {
          if (m & (1 << a)) allowed |= compat[d][a];
        }
        t[m] = allowed;
      }
      maskTable.push(t);
    }
  })();

  var dom = new Uint8Array(COLS * ROWS);
  var collapsedCount = 0;
  var restarts = 0;
  var running = true;
  var acc = 0;
  var interval = 60;
  var last = 0;

  function reset() {
    dom.fill(FULL);
    collapsedCount = 0;
    acc = 0;
    stateEl.textContent = "生成中";
    updateReadout();
  }

  function newRun() {
    reset();
  }

  function popcount(m) {
    var c = 0;
    while (m) { m &= m - 1; c++; }
    return c;
  }

  function idx(x, y) { return y * COLS + x; }

  function collapseCell(x, y) {
    var m = dom[idx(x, y)];
    var opts = [];
    for (var t = 0; t < TILES.length; t++) if (m & (1 << t)) opts.push(t);
    if (opts.length === 0) return false;
    var pick = opts[(Math.random() * opts.length) | 0];
    dom[idx(x, y)] = 1 << pick;
    return true;
  }

  function propagate(sx, sy) {
    var stack = [[sx, sy]];
    var guard = 0;

    while (stack.length) {
      if (++guard > 200000) return true;
      var cur = stack.pop();
      var x = cur[0], y = cur[1];
      var m = dom[idx(x, y)];
      if (m === 0) return false;

      for (var d = 0; d < 4; d++) {
        var nx = x + DIRS[d][0];
        var ny = y + DIRS[d][1];
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;

        var allowed = maskTable[d][m];
        var ni = idx(nx, ny);
        var before = dom[ni];
        var after = before & allowed;
        if (after !== before) {
          dom[ni] = after;
          if (after === 0) return false;
          stack.push([nx, ny]);
        }
      }
    }
    return true;
  }

  function stepOnce() {
    var best = -1, bestCount = 99;
    var tie = 0;

    for (var i = 0; i < dom.length; i++) {
      var c = popcount(dom[i]);
      if (c <= 1) continue;
      if (c < bestCount) { bestCount = c; best = i; tie = 1; }
      else if (c === bestCount) {
        tie++;
        if (Math.random() < 1 / tie) best = i;
      }
    }

    if (best < 0) {
      stateEl.textContent = "完成";
      running = false;
      return;
    }

    var x = best % COLS;
    var y = (best / COLS) | 0;

    if (!collapseCell(x, y)) { restart(); return; }
    var ok = propagate(x, y);
    if (!ok) { restart(); return; }

    collapsedCount = 0;
    for (var k = 0; k < dom.length; k++) if (popcount(dom[k]) === 1) collapsedCount++;
    updateReadout();
  }

  function restart() {
    restarts++;
    restartsEl.textContent = String(restarts);
    dom.fill(FULL);
    collapsedCount = 0;
    updateReadout();
  }

  function updateReadout() {
    doneEl.textContent = String(collapsedCount);
    var undecided = 0;
    for (var i = 0; i < dom.length; i++) if (popcount(dom[i]) > 1) undecided++;
    msEl.textContent = undecided + " マス未決定";
  }

  function draw() {
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var m = dom[idx(x, y)];
        var c = popcount(m);
        var px = x * CELL, py = y * CELL;

        if (c > 1) {
          // 未決定: うっすら点
          ctx.fillStyle = "rgba(196,181,253," + (0.03 + 0.02 * (4 - c)) + ")";
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          continue;
        }

        var t = 0;
        while (!(m & (1 << t)) && t < TILES.length - 1) t++;
        var tile = TILES[t];

        if (t === 7) {
          ctx.fillStyle = "rgba(42,54,70,.18)";
          ctx.fillRect(px, py, CELL - 1, CELL - 1);
          continue;
        }

        ctx.strokeStyle = tile.color;
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        var cx = px + CELL / 2, cy = py + CELL / 2;

        if (tile.L || tile.R || tile.U || tile.D) {
          ctx.beginPath();
          if (tile.L) { ctx.moveTo(px, cy); ctx.lineTo(cx, cy); }
          if (tile.R) { ctx.moveTo(cx, cy); ctx.lineTo(px + CELL, cy); }
          if (tile.U) { ctx.moveTo(cx, py); ctx.lineTo(cx, cy); }
          if (tile.D) { ctx.moveTo(cx, cy); ctx.lineTo(cx, py + CELL); }
          ctx.stroke();
        }
      }
    }
  }

  var frames = 0, fpsTimer = 0;
  function loop(now) {
    if (!fpsTimer) { fpsTimer = now; last = now; }
    var dt = Math.min(200, now - last);
    last = now;

    if (running) {
      acc += dt;
      var guard = 0;
      while (acc >= interval && guard < 20) {
        acc -= interval;
        for (var q = 0; q < 8 && running; q++) stepOnce();
        guard++;
        if (!running) break;
      }
    }
    draw();

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  speedEl.addEventListener("input", function () {
    interval = Number(speedEl.value);
    speedVal.textContent = interval + "ms";
  });

  document.getElementById("again").addEventListener("click", function () {
    running = true;
    newRun();
  });
  document.getElementById("pause").addEventListener("click", function () {
    running = !running;
    this.textContent = running ? "停止" : "再開";
    stateEl.textContent = running ? "生成中" : "停止中";
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
