<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たとえ算 — その金額、別のものさしで。</title>
<meta name="description" content="金額を入れるだけで、うまい棒・牛丼・映画・新幹線など別のものさしに変換。出費が少しだけ愛しくなる計算機。">
<meta property="og:title" content="たとえ算 — その金額、別のものさしで。">
<meta property="og:description" content="10,000円は、うまい棒833本。牛丼20杯。映画5本。金額を入れると、別のものさしが見えてくる。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/tatoe-zan/">
<meta property="og:site_name" content="たとえ算">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="たとえ算 — その金額、別のものさしで。">
<meta name="twitter:description" content="10,000円は、うまい棒833本。牛丼20杯。映画5本。金額を入れると、別のものさしが見えてくる。">
<meta name="theme-color" content="#f6f1e7">
<style>
  :root{
    --paper:#f6f1e7;
    --card:#fffdf8;
    --ink:#191713;
    --muted:#6f675b;
    --accent:#ff4d1c;
    --line:rgba(25,23,19,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, #ffe6d8 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:26px 20px calc(44px + env(safe-area-inset-bottom))}
  .brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .brand b{color:var(--ink);letter-spacing:.12em}
  h1{font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.05;margin:.42em 0 .18em;letter-spacing:-.03em}
  h1 span{color:var(--accent)}
  .lead{color:var(--muted);margin:0 0 20px;font-size:15px;line-height:1.65}
  .panel{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:20px;
    box-shadow:5px 5px 0 var(--ink);
    padding:18px 18px 16px;
  }
  .panel:focus-within{box-shadow:5px 5px 0 var(--accent)}
  .amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px dashed var(--line);padding-bottom:6px}
  .yen{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;color:var(--accent)}
  #amount{
    flex:1;min-width:0;width:100%;
    border:0;background:transparent;padding:0;
    font:inherit;font-size:clamp(2.1rem,10.5vw,3.6rem);
    font-weight:800;letter-spacing:-.035em;color:var(--ink);
    font-variant-numeric:tabular-nums;
    outline:none;
    -moz-appearance:textfield;
  }
  #amount::-webkit-outer-spin-button,#amount::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #amount::placeholder{color:#c9c1b2}
  .suffix{font-size:clamp(1rem,4vw,1.3rem);font-weight:700;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chips button{
    font:inherit;font-size:13px;font-weight:700;
    color:var(--ink);background:transparent;
    border:1.5px solid var(--line);border-radius:999px;
    padding:8px 13px;min-height:38px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
  }
  .chips button:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .chips button:active{transform:translateY(1px)}
  .chips button.dice{border-style:dashed}
  .chips button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .results{margin-top:22px}
  .results h2{font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 10px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:11px 13px 12px;
    min-height:94px;
    display:flex;flex-direction:column;justify-content:space-between;gap:6px;
    transition:transform .16s ease,border-color .16s ease;
  }
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .card .emoji{font-size:17px;line-height:1;opacity:.9}
  .card .name{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .card .num{font-size:clamp(1.3rem,5vw,1.65rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
  .card .num small{font-size:.56em;font-weight:700;color:var(--muted);margin-left:2px;letter-spacing:0}
  .card.pop{transform:scale(1.035);border-color:var(--ink)}
  .punch{
    margin-top:14px;
    background:var(--ink);color:#fff;
    border-radius:20px;
    padding:16px 18px 18px;
    border:2px solid var(--ink);
    box-shadow:5px 5px 0 rgba(255,77,28,.9);
  }
  .plabel{font-size:10.5px;letter-spacing:.22em;color:#ffb39c;font-weight:700;margin-bottom:7px}
  #punchText{margin:0;font-size:clamp(1.05rem,3.9vw,1.35rem);font-weight:700;line-height:1.6;letter-spacing:.005em}
  #punchText b{color:#ffcf7a;font-size:1.16em;font-variant-numeric:tabular-nums}
  .measure{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}
  .measure b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  .share{
    flex:1 1 220px;
    font:inherit;font-size:15px;font-weight:800;letter-spacing:.02em;
    color:#fff;background:var(--accent);
    border:2px solid var(--ink);border-radius:14px;
    padding:14px 18px;min-height:52px;cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .1s ease,box-shadow .1s ease,background .15s;
  }
  .share:hover{background:#ff3a00}
  .share:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .share:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .share.done{background:#1d7a4d}
  .foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.7}
  .foot b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><b>たとえ算</b><span>TATOE-ZAN</span></div>
  <h1>その金額、<br><span>別のものさし</span>で。</h1>
  <p class="lead">金額を入れるだけ。うまい棒、牛丼、映画、新幹線——いつもの出費が、ちょっと別の顔で見えてきます。</p>

  <section class="panel" aria-labelledby="amountLabel">
    <label id="amountLabel" for="amount" class="yen" style="display:none">金額</label>
    <div class="amount">
      <span class="yen" aria-hidden="true">¥</span>
      <input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
             placeholder="10000" value="10000" aria-describedby="hint" aria-label="金額（円）">
      <span class="suffix" aria-hidden="true">円</span>
    </div>
    <div class="chips" role="group" aria-label="よく使う金額">
      <button type="button" data-amount="500">500</button>
      <button type="button" data-amount="1000">1,000</button>
      <button type="button" data-amount="3000">3,000</button>
      <button type="button" data-amount="10000">10,000</button>
      <button type="button" data-amount="30000">30,000</button>
      <button type="button" data-amount="100000">100,000</button>
      <button type="button" class="dice" id="dice" aria-label="適当な金額を入れる">🎲 適当に</button>
    </div>
    <p id="hint" class="measure" style="margin-top:10px">数字を打つと、その場で計算します。</p>
  </section>

  <section class="results" aria-labelledby="resultsTitle">
    <h2 id="resultsTitle">その金額は、これくらい</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="punch" aria-label="ひとこと">
    <div class="plabel">ひとこと</div>
    <p id="punchText" aria-live="polite">…</p>
    <div class="measure" aria-label="物理的なたとえ">
      <span>1円玉 <b id="coinCount">10,000枚</b>（<b id="coinWeight">10.0kg</b>）</span>
      <span>一万円札 <b id="billCount">1枚</b>（厚さ <b id="billThick">0.1mm</b>）</span>
    </div>
  </section>

  <div class="actions">
    <button type="button" class="share" id="share">この結果をコピーする</button>
  </div>

  <p class="foot">
    価格は<b>だいたいの目安</b>です（うまい棒12円、牛丼498円、映画1,900円、新幹線14,720円…）。
    物価も気分も、日によって動きます。
  </p>
</main>

<script>
(function () {
  "use strict";

  var UNITS = [
    { key: "gyudon", name: "牛丼（並）", unit: "杯", price: 498, emoji: "🍚",
      line: "今日の昼は、もう決まり。" },
    { key: "ramen", name: "ラーメン", unit: "杯", price: 900, emoji: "🍜",
      line: "食べ歩きの旅が、はじまる。" },
    { key: "eiga", name: "映画", unit: "本", price: 1900, emoji: "🎬",
      line: "感想を言う相手が、必要だ。" },
    { key: "gacha", name: "カプセルトイ", unit: "回", price: 300, emoji: "🎰",
      line: "レアは、あと1回で出る。" },
    { key: "umaibo", name: "うまい棒", unit: "本", price: 12, emoji: "🥖",
      line: "しばらくおやつには困らない。" },
    { key: "shinkansen", name: "東京→新大阪（往復）", unit: "往復", price: 29440, emoji: "🚄",
      line: "会いに行く理由には、充分。" }
  ];

  var RANDOM_AMOUNTS = [398, 780, 1200, 1980, 2980, 4980, 6800, 9800, 12800, 19800, 29800, 49800, 98000, 128000, 298000, 500000, 1000000];

  var JOB = [
    { key: "gyudon", weight: 1 },
    { key: "ramen", weight: 1.4 },
    { key: "eiga", weight: 2 },
    { key: "gacha", weight: 2.6 },
    { key: "umaibo", weight: 3.2 },
    { key: "shinkansen", weight: 4 }
  ];

  var input = document.getElementById("amount");
  var grid = document.getElementById("grid");
  var punchText = document.getElementById("punchText");
  var coinCount = document.getElementById("coinCount");
  var coinWeight = document.getElementById("coinWeight");
  var billCount = document.getElementById("billCount");
  var billThick = document.getElementById("billThick");
  var share = document.getElementById("share");
  var dice = document.getElementById("dice");
  var nodes = {};

  function fmt(n, digits) {
    var opts = { maximumFractionDigits: digits === undefined ? 0 : digits, minimumFractionDigits: 0 };
    try { return n.toLocaleString("ja-JP", opts); } catch (e) { return String(Math.round(n)); }
  }

  function toHalf(s) {
    return String(s)
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[，,．.\s]/g, "");
  }

  function parseAmount() {
    var raw = toHalf(input.value).replace(/[^\d]/g, "").slice(0, 13);
    var n = Number(raw);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.min(Math.floor(n), 1000000000000);
  }

  function countText(n) {
    if (!isFinite(n) || n <= 0) return "0";
    if (n >= 1000) return fmt(Math.floor(n));
    if (n >= 10) return String(Math.floor(n));
    if (n >= 1) return (Math.floor(n * 10) / 10).toFixed(1);
    return (Math.floor(n * 100) / 100).toFixed(2);
  }

  function buildGrid() {
    var frag = document.createDocumentFragment();
    UNITS.forEach(function (u) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="top"><span class="name">' + u.name + '</span><span class="emoji" aria-hidden="true">' + u.emoji + '</span></div>' +
        '<div class="num"><span data-num="' + u.key + '">0</span><small>' + u.unit + '</small></div>';
      frag.appendChild(card);
      nodes[u.key] = { card: card, num: card.querySelector('[data-num]') };
    });
    grid.appendChild(frag);
  }

  function punchFor(amount) {
    if (amount <= 0) {
      return { html: "0円。まだ何もない。だから、何にでもなれる。" };
    }
    var best = null;
    var bestScore = Infinity;
    JOB.forEach(function (j) {
      var u = UNITS.filter(function (x) { return x.key === j.key; })[0];
      var c = amount / u.price;
      if (c < 1) return;
      var score = Math.abs(Math.log(c) - Math.log(8)) + j.weight * 0.12;
      if (c > 400) score += 2;
      if (score < bestScore) { bestScore = score; best = { u: u, c: c }; }
    });
    if (!best) {
      var tiny = UNITS.filter(function (x) { return x.key === "umaibo"; })[0];
      return { html: "まだ何も買えない。でも、夢は買える。" };
    }
    var c = best.c;
    var shown = countText(c);
    return {
      html: "その金額は、" + best.u.name + " <b>" + shown + best.u.unit + "</b>分。<br>" + best.u.line
    };
  }

  function setText(el, text, popEl) {
    if (el.textContent === text) return;
    el.textContent = text;
    if (popEl) {
      popEl.classList.add("pop");
      window.setTimeout(function () { popEl.classList.remove("pop"); }, 160);
    }
  }

  function render() {
    var amount = parseAmount();
    UNITS.forEach(function (u) {
      var n = amount / u.price;
      var node = nodes[u.key];
      if (!node) return;
      setText(node.num, countText(n), node.card);
    });

    var p = punchFor(amount);
    if (punchText.innerHTML !== p.html) punchText.innerHTML = p.html;

    if (amount > 0) {
      var grams = amount;
      var w = grams >= 1000 ? (grams / 1000).toFixed(1) + "kg" : Math.round(grams) + "g";
      coinCount.textContent = fmt(amount) + "枚";
      coinWeight.textContent = w;

      var bills = amount / 10000;
      var mm = bills * 0.1;
      billCount.textContent = (bills >= 1 ? countText(bills) : countText(bills)) + "枚";
      billThick.textContent = mm >= 1000 ? (mm / 1000).toFixed(2) + "m" : (mm < 1 ? mm.toFixed(2) : mm.toFixed(1)) + "mm";
    } else {
      coinCount.textContent = "0枚";
      coinWeight.textContent = "0g";
      billCount.textContent = "0枚";
      billThick.textContent = "0mm";
    }

    share.dataset.amount = String(amount);
    return amount;
  }

  function shareText(amount) {
    if (amount <= 0) return "";
    var lines = ["【たとえ算】" + fmt(amount) + "円"];
    ["umaibo", "gyudon", "eiga", "shinkansen"].forEach(function (key) {
      var u = UNITS.filter(function (x) { return x.key === key; })[0];
      var c = amount / u.price;
      if (c >= 1) lines.push("＝ " + u.name + " " + countText(c) + u.unit);
    });
    lines.push("https://rinderdragon0823.github.io/site-factory/tatoe-zan/");
    return lines.join("\n");
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  input.addEventListener("input", function () {
    var clean = toHalf(input.value).replace(/[^\d]/g, "").slice(0, 13);
    if (input.value !== clean) input.value = clean;
    render();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      input.blur();
      render();
    }
  });

  document.querySelectorAll(".chips button[data-amount]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      input.value = btn.getAttribute("data-amount");
      render();
      input.focus();
    });
  });

  dice.addEventListener("click", function () {
    var pick = RANDOM_AMOUNTS[Math.floor(Math.random() * RANDOM_AMOUNTS.length)];
    input.value = String(pick);
    render();
    input.focus();
  });

  share.addEventListener("click", function () {
    var amount = parseAmount();
    if (amount <= 0) {
      input.focus();
      return;
    }
    copyText(shareText(amount)).then(function (ok) {
      share.textContent = ok ? "コピーしました ✓" : "コピーできませんでした";
      share.classList.add("done");
      window.setTimeout(function () {
        share.textContent = "この結果をコピーする";
        share.classList.remove("done");
      }, 1600);
    });
  });

  buildGrid();
  render();
})();
</script>
</body>
</html>
