<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>めくってペア — 16枚から、8組さがす。</title>
<meta name="description" content="4×4のカードから同じ絵を2枚ずつ探す記憶ゲーム。手数とタイムを競えます。シャッフルで何度でも。">
<meta property="og:title" content="めくってペア — 16枚から、8組さがす。">
<meta property="og:description" content="4×4・8組の記憶ゲーム。何手で、何秒で揃えられるか。ベスト記録つき。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/mekutte-pair/">
<meta property="og:site_name" content="めくってペア">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0f2a22">
<style>
  :root{
    --felt:#0f2a22;
    --felt2:#14352b;
    --ink:#f4f1e6;
    --muted:rgba(244,241,230,.6);
    --gold:#e8c15a;
    --line:rgba(244,241,230,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 50% -20%, #1d4638 0%, transparent 60%),
      linear-gradient(180deg, var(--felt2), var(--felt));
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:520px;margin:auto;width:100%;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
  .kicker{margin:0;font-size:10px;letter-spacing:.3em;color:var(--gold);font-weight:800}
  h1{margin:.26em 0 .1em;font-size:clamp(1.7rem,6.6vw,2.3rem);letter-spacing:-.02em;line-height:1.08}
  .lead{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.65}

  .hud{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .hud .cell{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:800}
  .hud .cell b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .hud .cell.best b{color:var(--gold)}

  .board{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    padding:12px;border-radius:16px;
    background:rgba(0,0,0,.22);
    border:1px solid var(--line);
    box-shadow:inset 0 0 40px rgba(0,0,0,.35);
  }
  .card{
    position:relative;aspect-ratio:1/1;padding:0;border:0;background:none;cursor:pointer;
    perspective:700px;
  }
  .card .inner{
    position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform .34s cubic-bezier(.3,.8,.3,1);
  }
  .card.open .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    font-size:clamp(22px,7vw,34px);
  }
  .back{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 6px, transparent 6px 12px),
      linear-gradient(160deg,#1e4b3c,#173a2f);
    border:1.5px solid rgba(232,193,90,.35);
    color:rgba(232,193,90,.5);
    font-size:16px;
  }
  .front{
    background:linear-gradient(160deg,#fdfbf3,#efe9d8);
    transform:rotateY(180deg);
    border:1.5px solid rgba(0,0,0,.2);
  }
  .card.matched .front{box-shadow:0 0 0 3px rgba(232,193,90,.8) inset}
  .card.matched{cursor:default}
  .card:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}
  .card:not(.open):hover .back{border-color:var(--gold)}

  .controls{display:flex;gap:8px;margin-top:12px}
  .controls button{
    font:inherit;font-size:13px;font-weight:800;border-radius:12px;cursor:pointer;
    padding:12px 14px;min-height:48px;
    transition:transform .08s,background .15s,border-color .15s;
  }
  #again{flex:1;color:#141005;background:var(--gold);border:2px solid #0a1d17;box-shadow:3px 3px 0 #0a1d17}
  #again:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0a1d17}
  #shuffle{flex:0 0 120px;color:var(--ink);background:transparent;border:1.5px solid var(--line)}
  #shuffle:hover{border-color:var(--ink)}
  .controls button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .status{margin:10px 0 0;font-size:11.5px;color:var(--muted);min-height:1.4em}
  .note{margin-top:8px;font-size:10.5px;color:rgba(244,241,230,.4);line-height:1.7}

  .overlay{
    position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    padding:18px;background:rgba(6,16,12,.72);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .overlay.hidden{display:none}
  .panel{
    width:100%;max-width:320px;text-align:center;
    background:#14352b;border:1px solid var(--line);border-radius:16px;
    padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .panel h2{margin:.1em 0 .2em;font-size:1.4rem}
  .panel .time{font-size:2.6rem;font-weight:900;color:var(--gold);letter-spacing:-.03em;line-height:1}
  .panel p{margin:8px 0 16px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .panel button{
    width:100%;font:inherit;font-size:15px;font-weight:900;
    color:#141005;background:var(--gold);border:0;border-radius:11px;
    padding:14px;min-height:50px;cursor:pointer;box-shadow:0 4px 0 #a8873a;
  }
  .panel button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8873a}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">16 CARDS / 8 PAIRS</p>
  <h1>めくってペア</h1>
  <p class="lead">4×4のカードから、同じ絵を2枚ずつ。手数とタイムで競います。</p>

  <div class="hud">
    <div class="cell">手数<b id="moves">0</b></div>
    <div class="cell">タイム<b id="time">0.0</b></div>
    <div class="cell best">ベスト<b id="best">--</b></div>
  </div>

  <div class="board" id="board" role="group" aria-label="カード"></div>

  <div class="controls">
    <button type="button" id="again">もう一回</button>
    <button type="button" id="shuffle">シャッフル</button>
  </div>

  <p class="status" id="status" aria-live="polite">カードをめくって、同じ絵をさがしてください。</p>
  <p class="note">最初の配置は固定です。シャッフルを押すと毎回かわります。</p>
</main>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <p class="kicker" style="color:#e8c15a">CLEAR</p>
    <p class="time" id="clearTime">0.0 秒</p>
    <p id="clearDetail">手数 0 ／ ベスト --</p>
    <button type="button" id="overlayAgain">もう一回</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var EMOJI = ["🍎", "🍌", "🍇", "🍓", "🥝", "🍑", "🍒", "🍍"];
  // 固定配置（ペア位置: 1-16, 2-9, 3-10, 4-13, 5-12, 6-11, 7-14, 8-15）
  var FIXED = [2, 5, 0, 7, 1, 6, 3, 4, 5, 0, 6, 1, 7, 3, 4, 2];

  var board = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var timeEl = document.getElementById("time");
  var bestEl = document.getElementById("best");
  var statusEl = document.getElementById("status");
  var overlay = document.getElementById("overlay");
  var clearTime = document.getElementById("clearTime");
  var clearDetail = document.getElementById("clearDetail");

  var layout = FIXED.slice();
  var cards = [];
  var open = [];
  var matched = 0;
  var moves = 0;
  var startedAt = 0;
  var running = false;
  var locked = false;
  var raf = 0;
  var best = null;

  try {
    var b = Number(window.localStorage.getItem("mekutte_best") || 0);
    best = b > 0 ? b : null;
  } catch (e) { best = null; }

  function fmt(sec) { return sec.toFixed(1); }

  function renderBest() {
    bestEl.textContent = best ? fmt(best) + "s" : "--";
  }

  function build() {
    board.textContent = "";
    cards = [];
    layout.forEach(function (pair, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card";
      btn.setAttribute("aria-label", "カード" + (i + 1 < 10 ? "0" : "") + (i + 1));
      btn.innerHTML =
        '<span class="inner">' +
        '<span class="face back" aria-hidden="true">◆</span>' +
        '<span class="face front" aria-hidden="true">' + EMOJI[pair] + "</span>" +
        "</span>";
      btn.addEventListener("click", function () { flip(i); });
      board.appendChild(btn);
      cards.push({ el: btn, pair: pair, open: false, matched: false });
    });
  }

  function reset(newLayout) {
    if (newLayout) layout = shuffle(FIXED.slice());
    open = [];
    matched = 0;
    moves = 0;
    running = false;
    locked = false;
    startedAt = 0;
    movesEl.textContent = "0";
    timeEl.textContent = "0.0";
    overlay.classList.add("hidden");
    statusEl.textContent = "カードをめくって、同じ絵をさがしてください。";
    build();
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function flip(i) {
    if (locked) return;
    var c = cards[i];
    if (!c || c.open || c.matched) return;

    if (!running) {
      running = true;
      startedAt = performance.now();
      tick();
    }

    c.open = true;
    c.el.classList.add("open");
    open.push(i);

    if (open.length < 2) return;

    moves += 1;
    movesEl.textContent = String(moves);
    var a = cards[open[0]];
    var b = cards[open[1]];

    if (a.pair === b.pair) {
      a.matched = true;
      b.matched = true;
      a.el.classList.add("matched");
      b.el.classList.add("matched");
      open = [];
      matched += 1;
      statusEl.textContent = "そろいました（" + matched + "/8組）";
      if (matched === 8) win();
    } else {
      locked = true;
      statusEl.textContent = "ちがいます…";
      window.setTimeout(function () {
        a.open = false;
        b.open = false;
        a.el.classList.remove("open");
        b.el.classList.remove("open");
        open = [];
        locked = false;
        statusEl.textContent = "つづけてどうぞ。";
      }, 720);
    }
  }

  function tick() {
    if (!running) return;
    timeEl.textContent = fmt((performance.now() - startedAt) / 1000);
    raf = requestAnimationFrame(tick);
  }

  function win() {
    running = false;
    cancelAnimationFrame(raf);
    var secs = (performance.now() - startedAt) / 1000;
    timeEl.textContent = fmt(secs);
    var isBest = !best || secs < best;
    if (isBest) {
      best = secs;
      try { window.localStorage.setItem("mekutte_best", String(secs)); } catch (e) {}
      renderBest();
    }
    clearTime.textContent = fmt(secs) + " 秒";
    clearDetail.textContent = "手数 " + moves + " ／ " + (isBest ? "自己ベスト更新!" : "ベスト " + fmt(best) + " 秒");
    overlay.classList.remove("hidden");
    statusEl.textContent = "クリア。おつかれさまでした。";
    document.getElementById("overlayAgain").focus({ preventScroll: true });
  }

  document.getElementById("again").addEventListener("click", function () { reset(false); });
  document.getElementById("shuffle").addEventListener("click", function () { reset(true); });
  document.getElementById("overlayAgain").addEventListener("click", function () { reset(false); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { overlay.classList.add("hidden"); reset(false); }
  });

  renderBest();
  reset(false);
})();
</script>
</body>
</html>
