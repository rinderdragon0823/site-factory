<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L-system — 書き換えが、枝になる。</title>
<meta name="description" content="L-system（リンデンマイヤー・システム）で木を描く技術デモ。文字列の書き換えとタートルグラフィックスで、枝分かれが生まれます。">
<meta property="og:title" content="L-system — 書き換えが、枝になる。">
<meta property="og:description" content="F を規則で置き換えて、亀に歩かせる。それだけで木になります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/lsystem-tree/">
<meta property="og:site_name" content="L-system">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#06080c">
<style>
  :root{
    --bg:#06080c;
    --panel:#0c1219;
    --ink:#e9f2ea;
    --muted:rgba(233,242,234,.56);
    --leaf:#7bd88f;
    --line:rgba(233,242,234,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #12291f 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #1a1a2e 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:680px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--leaf);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.5rem,5.6vw,2rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#04070a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #tree{display:block;width:100%;height:auto}
  .hint{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(233,242,234,.45);pointer-events:none}

  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{
    flex:1 1 0;font:inherit;font-size:11.5px;font-weight:800;
    color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:999px;
    padding:9px 10px;min-height:38px;cursor:pointer;
  }
  .presets button:hover{color:var(--ink);border-color:var(--leaf)}
  .presets button[aria-pressed="true"]{background:var(--leaf);color:#08210f;border-color:var(--leaf)}
  .presets button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:96px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--leaf);min-width:0;cursor:pointer}
  .row output{width:58px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1219;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--leaf)}
  .actions button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,242,234,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">LINDENMAYER SYSTEM</p>
      <h1>L-system</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0 本の枝</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="tree" width="640" height="520" role="img" aria-label="L-systemで描いた木"></canvas>
    <div class="hint">文字列を書き換えて、亀に歩かせています</div>
  </div>

  <div class="presets" role="group" aria-label="文法">
    <button type="button" data-p="tree" aria-pressed="true">木</button>
    <button type="button" data-p="fern" aria-pressed="false">シダ</button>
    <button type="button" data-p="koch" aria-pressed="false">コッホ</button>
  </div>

  <div class="panel">
    <div class="row"><label for="iter">反復回数</label><input id="iter" type="range" min="2" max="5" step="1" value="4"><output id="iterVal">4</output></div>
    <div class="row"><label for="angle">枝の角度</label><input id="angle" type="range" min="10" max="45" step="1" value="22"><output id="angleVal">22°</output></div>
    <div class="row"><label for="sway">揺れ</label><input id="sway" type="range" min="0" max="1.5" step="0.05" value="0.5"><output id="swayVal">0.50</output></div>
  </div>

  <div class="actions">
    <button type="button" id="replay">もう一度育てる</button>
  </div>

  <p class="note">
    <b>F → FF+[+F−F−F]−[−F+F+F]</b> のような置き換えを、反復回数ぶん繰り返して文字列を作ります。あとは「F で前へ、＋で左、−で右、[ ] で枝分かれ」と亀を動かすだけ。
    揺れは、根からの深さに応じて角度を少しずつずらして出しています。
  </p>
</main>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("tree");
  var ctx = canvas.getContext("2d", { alpha: false });
  var W = 640, H = 520;
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var iterEl = document.getElementById("iter");
  var angleEl = document.getElementById("angle");
  var swayEl = document.getElementById("sway");
  var iterVal = document.getElementById("iterVal");
  var angleVal = document.getElementById("angleVal");
  var swayVal = document.getElementById("swayVal");

  var PRESETS = {
    tree: { axiom: "F", rules: { F: "FF+[+F-F-F]-[-F+F+F]" }, angle: 22, ratio: 0.72, startLen: 46 },
    fern: { axiom: "X", rules: { X: "F+[[X]-X]-F[-FX]+X", F: "FF" }, angle: 25, ratio: 0.68, startLen: 34 },
    koch: { axiom: "F", rules: { F: "F+F--F+F" }, angle: 60, ratio: 0.42, startLen: 120 }
  };

  var preset = "tree";
  var iters = 4;
  var angleDeg = 22;
  var sway = 0.5;
  var nodes = [];
  var total = 1;
  var growthStart = 0;
  var growthDur = 2200;

  function expand() {
    var pr = PRESETS[preset];
    var str = pr.axiom;
    for (var i = 0; i < iters; i++) {
      var out = "";
      for (var c = 0; c < str.length; c++) {
        var ch = str[c];
        out += pr.rules[ch] || ch;
        if (out.length > 90000) break;
      }
      str = out;
      if (str.length > 90000) break;
    }
    return str;
  }

  function build() {
    var str = expand();
    nodes = [];
    var root = { a: 0, depth: 0, order: -1, children: [] };
    var cur = root;
    var ang = 0;
    var depth = 0;
    var order = 0;
    var stack = [];

    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch === "F") {
        var node = { a: ang, depth: depth + 1, order: order++, children: [] };
        cur.children.push(node);
        cur = node;
      } else if (ch === "+") {
        ang += angleDeg * Math.PI / 180;
      } else if (ch === "-") {
        ang -= angleDeg * Math.PI / 180;
      } else if (ch === "[") {
        stack.push({ node: cur, ang: ang, depth: depth });
        depth += 1;
        ang = 0;
      } else if (ch === "]") {
        var st = stack.pop();
        if (st) { cur = st.node; ang = st.ang; depth = st.depth; }
      }
    }

    nodes = root.children;
    total = Math.max(1, order);
    msEl.textContent = total.toLocaleString("en-US") + " 本の枝";
    growthStart = performance.now();
  }

  function drawNode(node, x, y, baseAng, time, shown, maxDepth, pr) {
    var wobble = Math.sin(time * 1.3 + node.depth * 0.55) * 0.025 * sway * (node.depth + 1);
    var a = baseAng + node.a + wobble;
    var len = pr.startLen * Math.pow(pr.ratio, node.depth - 1);
    var nx = x + Math.cos(a) * len;
    var ny = y + Math.sin(a) * len;

    if (node.order < shown) {
      var leaf = node.depth / maxDepth;
      var r = Math.round(104 + 40 * leaf);
      var g = Math.round(78 + 150 * leaf);
      var b = Math.round(58 + 80 * leaf);
      ctx.strokeStyle = "rgb(" + r + "," + g + "," + b + ")";
      ctx.lineWidth = Math.max(0.8, 5.4 - node.depth * 0.85);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(nx, ny);
      ctx.stroke();
    }

    for (var i = 0; i < node.children.length; i++) {
      drawNode(node.children[i], nx, ny, a, time, shown, maxDepth, pr);
    }
  }

  function draw(now) {
    ctx.fillStyle = "#04070a";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(123,216,143,.05)";
    ctx.fillRect(0, H - 40, W, 40);

    var pr = PRESETS[preset];
    var t = (now - growthStart) / growthDur;
    var shown = Math.min(1, Math.max(0, t)) * total;

    var maxDepth = 1;
    (function walk(list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].depth > maxDepth) maxDepth = list[i].depth;
        walk(list[i].children);
      }
    })(nodes);

    ctx.lineCap = "round";
    for (var i = 0; i < nodes.length; i++) {
      drawNode(nodes[i], W / 2, H - 30, -Math.PI / 2, now * 0.001, shown, maxDepth, pr);
    }
  }

  var frames = 0, fpsTimer = 0;
  function loop(now) {
    if (!fpsTimer) fpsTimer = now;
    draw(now);
    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  function rebuild() {
    build();
  }

  document.querySelectorAll(".presets button").forEach(function (b) {
    b.addEventListener("click", function () {
      preset = b.getAttribute("data-p");
      document.querySelectorAll(".presets button").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      angleDeg = PRESETS[preset].angle;
      angleEl.value = String(angleDeg);
      angleVal.textContent = angleDeg + "°";
      rebuild();
    });
  });

  iterEl.addEventListener("input", function () {
    iters = Number(iterEl.value);
    iterVal.textContent = String(iters);
    rebuild();
  });
  angleEl.addEventListener("input", function () {
    angleDeg = Number(angleEl.value);
    angleVal.textContent = angleDeg + "°";
    rebuild();
  });
  swayEl.addEventListener("input", function () {
    sway = Number(swayEl.value);
    swayVal.textContent = sway.toFixed(2);
  });

  document.getElementById("replay").addEventListener("click", rebuild);

  build();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
