<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ローレンツ — 2つの渦を、永遠に行き来する。</title>
<meta name="description" content="ローレンツ方程式の軌道を3Dで描く技術デモ。σ・ρ・βを動かすと、あの蝶の形が変わります。">
<meta property="og:title" content="ローレンツ — 2つの渦を、永遠に行き来する。">
<meta property="og:description" content="3つの微分方程式から、蝶が生まれます。パラメータを変えると形が変わる、ローレンツアトラクタ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/lorenz-attractor/">
<meta property="og:site_name" content="ローレンツ">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#05070c">
<style>
  :root{
    --bg:#05070c;
    --panel:#0c1119;
    --ink:#e9eff8;
    --muted:rgba(233,239,248,.56);
    --gold:#fbbf24;
    --line:rgba(233,239,248,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 90% -10%, #2a2110 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #141a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:700px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--gold);font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.5rem,5.6vw,2rem);letter-spacing:-.02em;line-height:1.1}
  .stats{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:800;line-height:1.7}
  .stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

  .stage{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#03050a;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  #view{display:block;width:100%;height:auto}

  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{
    flex:1 1 0;font:inherit;font-size:11.5px;font-weight:800;
    color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:999px;
    padding:9px 10px;min-height:38px;cursor:pointer;
  }
  .presets button:hover{color:var(--ink);border-color:var(--gold)}
  .presets button[aria-pressed="true"]{background:var(--gold);color:#231a04;border-color:var(--gold)}
  .presets button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .panel{margin-top:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .row label{width:96px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--gold);min-width:0;cursor:pointer}
  .row output{width:62px;flex:none;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{
    flex:1;font:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#0c1119;border:1.5px solid var(--line);border-radius:10px;
    padding:11px;min-height:44px;cursor:pointer;
  }
  .actions button:hover{border-color:var(--gold)}
  .actions button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .note{margin:10px 0 0;font-size:10.5px;color:rgba(233,239,248,.42);line-height:1.8}
  .note b{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">LORENZ SYSTEM / RK4</p>
      <h1>ローレンツ</h1>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span id="ms">0 点</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="view" width="640" height="520" role="img" aria-label="ローレンツアトラクタの軌道"></canvas>
  </div>

  <div class="presets" role="group" aria-label="パラメータ">
    <button type="button" data-p="classic" aria-pressed="true">基本</button>
    <button type="button" data-p="high" aria-pressed="false">ρ 高め</button>
    <button type="button" data-p="low" aria-pressed="false">ρ 低め</button>
  </div>

  <div class="panel">
    <div class="row"><label for="rho">ρ（回転）</label><input id="rho" type="range" min="8" max="45" step="0.5" value="28"><output id="rhoVal">28.0</output></div>
    <div class="row"><label for="sigma">σ（粘性）</label><input id="sigma" type="range" min="2" max="20" step="0.2" value="10"><output id="sigmaVal">10.0</output></div>
    <div class="row"><label for="beta">β（幾何）</label><input id="beta" type="range" min="0.5" max="6" step="0.1" value="2.67"><output id="betaVal">2.67</output></div>
    <div class="row"><label for="len">軌道の長さ</label><input id="len" type="range" min="800" max="6000" step="200" value="3000"><output id="lenVal">3000</output></div>
    <div class="row"><label for="rot">回転</label><input id="rot" type="range" min="0" max="1" step="0.05" value="0.25"><output id="rotVal">0.25</output></div>
  </div>

  <div class="actions">
    <button type="button" id="reset">リセット</button>
  </div>

  <p class="note">
    <b>dx/dt = σ(y−x)、dy/dt = x(ρ−z)−y、dz/dt = xy−βz</b>。この3本をRK4で積分した軌道を、回転させて描いています。
    ρを上げると渦が大きくなり、下げると軌道が片側に寄ります。線の色は速度です。
  </p>
</main>

<script>
(function () {
  "use strict";

  var W = 640, H = 520;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  var fpsEl = document.getElementById("fps");
  var msEl = document.getElementById("ms");
  var rhoEl = document.getElementById("rho");
  var sigmaEl = document.getElementById("sigma");
  var betaEl = document.getElementById("beta");
  var lenEl = document.getElementById("len");
  var rotEl = document.getElementById("rot");
  var rhoVal = document.getElementById("rhoVal");
  var sigmaVal = document.getElementById("sigmaVal");
  var betaVal = document.getElementById("betaVal");
  var lenVal = document.getElementById("lenVal");
  var rotVal = document.getElementById("rotVal");

  var sigma = 10, rho = 28, beta = 2.67;
  var trailLen = 3000;
  var rotSpeed = 0.25;
  var dt = 0.008;
  var stepsPerFrame = 30;

  var MAXP = 6000;
  var xs = new Float32Array(MAXP), ys = new Float32Array(MAXP), zs = new Float32Array(MAXP);
  var vs = new Float32Array(MAXP);
  var count = 0;
  var head = 0;

  var x = 1, y = 1, z = 1;
  var yaw = 0;
  var steps = 0;

  function reset() {
    x = 1 + Math.random() * 0.1;
    y = 1 + Math.random() * 0.1;
    z = 1 + Math.random() * 0.1;
    count = 0;
    head = 0;
    steps = 0;
  }

  function deriv(xx, yy, zz, out) {
    out[0] = sigma * (yy - xx);
    out[1] = xx * (rho - zz) - yy;
    out[2] = xx * yy - beta * zz;
  }

  var k1 = [0, 0, 0], k2 = [0, 0, 0], k3 = [0, 0, 0], k4 = [0, 0, 0], tmp = [0, 0, 0];

  function rk4() {
    deriv(x, y, z, k1);
    deriv(x + k1[0] * dt / 2, y + k1[1] * dt / 2, z + k1[2] * dt / 2, k2);
    deriv(x + k2[0] * dt / 2, y + k2[1] * dt / 2, z + k2[2] * dt / 2, k3);
    deriv(x + k3[0] * dt, y + k3[1] * dt, z + k3[2] * dt, k4);

    var nx = x + (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) * dt / 6;
    var ny = y + (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) * dt / 6;
    var nz = z + (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]) * dt / 6;

    var v = Math.hypot(nx - x, ny - y, nz - z) / dt;

    x = nx; y = ny; z = nz;
    steps++;

    xs[head] = x; ys[head] = y; zs[head] = z; vs[head] = v;
    head = (head + 1) % MAXP;
    if (count < MAXP) count++;
  }

  function project(px, py, pz, ca, sa) {
    var rx = px * ca - py * sa;
    var ry = px * sa + py * ca;
    var scale = 8.2;
    return {
      x: W / 2 + rx * scale,
      y: H / 2 + 30 - (pz - 25) * scale * 0.95 + ry * 0.16
    };
  }

  function draw() {
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, W, H);

    var ca = Math.cos(yaw), sa = Math.sin(yaw);
    var n = Math.min(count, trailLen);

    // 色バケットごとにまとめて線を引く
    var BUCKETS = 10;
    var buckets = [];
    for (var b = 0; b < BUCKETS; b++) buckets.push([]);

    var start = (head - n + MAXP) % MAXP;
    var prev = null;

    for (var i = 0; i < n; i++) {
      var idx = (start + i) % MAXP;
      var p = project(xs[idx], ys[idx], zs[idx], ca, sa);
      if (prev) {
        var sp = vs[idx];
        var bi = Math.min(BUCKETS - 1, Math.max(0, Math.floor(sp / 14)));
        buckets[bi].push(prev.x, prev.y, p.x, p.y);
      }
      prev = p;
    }

    for (var bb = 0; bb < BUCKETS; bb++) {
      var arr = buckets[bb];
      if (!arr.length) continue;
      var hue = 205 - bb * 18;
      ctx.strokeStyle = "hsla(" + hue + ",90%," + (52 + bb * 2.5) + "%," + (0.35 + bb * 0.06) + ")";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (var j = 0; j < arr.length; j += 4) {
        ctx.moveTo(arr[j], arr[j + 1]);
        ctx.lineTo(arr[j + 2], arr[j + 3]);
      }
      ctx.stroke();
    }

    // 先頭
    if (count > 0) {
      var hp = (head - 1 + MAXP) % MAXP;
      var pp = project(xs[hp], ys[hp], zs[hp], ca, sa);
      ctx.fillStyle = "#fde68a";
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, 3, 0, 6.283);
      ctx.fill();
    }
  }

  var frames = 0, fpsTimer = 0, smooth = 0;
  function loop(now) {
    if (!fpsTimer) fpsTimer = now;

    var t0 = performance.now();
    for (var s = 0; s < stepsPerFrame; s++) rk4();
    yaw += rotSpeed * 0.004;
    draw();
    smooth = smooth * 0.9 + (performance.now() - t0) * 0.1;

    frames++;
    if (now - fpsTimer > 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - fpsTimer)));
      msEl.textContent = smooth.toFixed(1) + " ms / " + Math.min(count, trailLen) + " 点";
      frames = 0;
      fpsTimer = now;
    }
    requestAnimationFrame(loop);
  }

  var PRESETS = {
    classic: { s: 10, r: 28, b: 2.67 },
    high: { s: 10, r: 40, b: 2.6 },
    low: { s: 10, r: 15, b: 2.6 }
  };

  document.querySelectorAll(".presets button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var p = PRESETS[btn.getAttribute("data-p")];
      sigma = p.s; rho = p.r; beta = p.b;
      sigmaEl.value = String(sigma);
      rhoEl.value = String(rho);
      betaEl.value = String(beta);
      sigmaVal.textContent = sigma.toFixed(1);
      rhoVal.textContent = rho.toFixed(1);
      betaVal.textContent = beta.toFixed(2);
      document.querySelectorAll(".presets button").forEach(function (x2) {
        x2.setAttribute("aria-pressed", x2 === btn ? "true" : "false");
      });
      reset();
    });
  });

  rhoEl.addEventListener("input", function () { rho = Number(rhoEl.value); rhoVal.textContent = rho.toFixed(1); });
  sigmaEl.addEventListener("input", function () { sigma = Number(sigmaEl.value); sigmaVal.textContent = sigma.toFixed(1); });
  betaEl.addEventListener("input", function () { beta = Number(betaEl.value); betaVal.textContent = beta.toFixed(2); });
  lenEl.addEventListener("input", function () { trailLen = Number(lenEl.value); lenVal.textContent = String(trailLen); });
  rotEl.addEventListener("input", function () { rotSpeed = Number(rotEl.value); rotVal.textContent = rotSpeed.toFixed(2); });

  document.getElementById("reset").addEventListener("click", reset);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
