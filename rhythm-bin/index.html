<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リズム便 — 落ちてくる音を、線で拾う。</title>
<meta name="description" content="4つのレーンに落ちてくる音を、線のところで叩くリズムゲーム。D・F・J・Kキーとタップに対応。">
<meta property="og:title" content="リズム便 — 落ちてくる音を、線で拾う。">
<meta property="og:description" content="4レーン・14音の短いリズムゲーム。PERFECTを重ねて、ランクSを目指してください。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/rhythm-bin/">
<meta property="og:site_name" content="リズム便">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b0d14">
<style>
  :root{
    --bg:#0b0d14;
    --panel:#141926;
    --ink:#f2f4f8;
    --muted:rgba(242,244,248,.6);
    --line:rgba(242,244,248,.14);
    --lane0:#ff6b6b;
    --lane1:#ffd23f;
    --lane2:#5ad1a0;
    --lane3:#5aa9ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(800px 460px at 90% -10%, #1b2440 0%, transparent 60%),
      radial-gradient(700px 420px at 0% 110%, #14243a 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:560px;margin:auto;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
  .kicker{margin:0;font-size:10px;letter-spacing:.3em;color:#5aa9ff;font-weight:800}
  h1{margin:.24em 0 0;font-size:clamp(1.6rem,6vw,2.2rem);letter-spacing:-.02em;line-height:1.08}
  .hudText{text-align:right;font-size:11px;color:var(--muted);line-height:1.5}
  .hudText b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .stage{
    position:relative;margin-top:10px;
    height:clamp(360px,54vh,560px);
    border-radius:16px;overflow:hidden;
    border:1px solid var(--line);
    background:#0e121c;
    box-shadow:0 18px 44px rgba(0,0,0,.5);
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #field{display:block;width:100%;height:100%}

  .hud{
    position:absolute;inset:0;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:12px 14px;
  }
  .hud .combo{font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .hud .combo small{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--muted);font-weight:800}
  .hud .score{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}

  .overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(8,10,16,.62);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    pointer-events:none;
  }
  .overlay.hidden{display:none}
  .panel{
    pointer-events:auto;
    width:100%;max-width:340px;text-align:center;
    background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:20px 18px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .panel h2{margin:.2em 0 .3em;font-size:1.4rem;letter-spacing:-.02em}
  .panel p{margin:0 0 14px;font-size:12.5px;line-height:1.7;color:var(--muted)}
  .panel button{
    width:100%;font:inherit;font-size:16px;font-weight:900;letter-spacing:.04em;
    color:#0f1420;background:#5aa9ff;border:0;border-radius:11px;
    padding:14px;min-height:52px;cursor:pointer;
    box-shadow:0 4px 0 #2f6bb0;transition:transform .08s,box-shadow .08s;
  }
  .panel button:active{transform:translateY(3px);box-shadow:0 1px 0 #2f6bb0}
  .panel button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .keys{margin:10px 0 0;font-size:10.5px;color:var(--muted)}
  .rank{font-size:3rem;font-weight:900;line-height:1;margin:2px 0 6px;letter-spacing:-.04em}
  .rows{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--muted);margin-bottom:12px}
  .rows b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .badge{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    font-size:9.5px;font-weight:800;letter-spacing:.3em;color:#ffd23f;
    border:1px solid rgba(255,210,63,.5);border-radius:999px;padding:4px 10px;
    pointer-events:none;
  }
  .note{margin-top:10px;font-size:10.5px;color:rgba(242,244,248,.4);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="kicker">4 LANE RHYTHM</p>
      <h1>リズム便</h1>
    </div>
    <div class="hudText">SCORE<b id="scoreTop">0</b></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="field" role="img" aria-label="リズムゲームのフィールド"></canvas>
    <div class="hud">
      <div class="combo"><span id="combo">0</span><small>COMBO</small></div>
    </div>
    <div class="badge" id="badge" hidden>DEMO</div>
    <div class="overlay" id="overlay">
      <div class="panel" id="panelTitle">
        <p class="kicker" style="color:#5aa9ff">READY?</p>
        <h2>線で、拾う。</h2>
        <p>落ちてくる音が線に重なった瞬間に、D・F・J・Kを叩きます。タップでも遊べます。</p>
        <button type="button" id="startBtn">はじめる</button>
        <p class="keys">放置するとデモが流れます</p>
      </div>
      <div class="panel" id="panelResult" hidden>
        <p class="kicker" style="color:#5aa9ff">RESULT</p>
        <p class="rank" id="rank">A</p>
        <div class="rows">
          <div>PERFECT<b id="rPerfect">0</b></div>
          <div>GOOD<b id="rGood">0</b></div>
          <div>MISS<b id="rMiss">0</b></div>
          <div>MAX COMBO<b id="rCombo">0</b></div>
        </div>
        <button type="button" id="againBtn">もう一回</button>
      </div>
    </div>
  </div>

  <p class="note">音は鳴りません。リズムは、目で拾ってください。14音・約8秒の短い便です。</p>
</main>

<script>
(function () {
  "use strict";

  var LANES = 4;
  var COLORS = ["#ff6b6b", "#ffd23f", "#5ad1a0", "#5aa9ff"];
  var KEYS = { d: 0, f: 1, j: 2, k: 3 };
  var TRAVEL = 1500;
  var HIT_MS = 1000;
  var END_MS = 8200;

  var CHART = [
    [1000, 0], [1500, 1], [2000, 2], [2500, 3], [3000, 2], [3500, 1],
    [4000, 0], [4000, 3], [4500, 1], [5000, 2], [5500, 0], [6000, 3],
    [6500, 2], [7000, 1], [7500, 0], [7500, 2]
  ];

  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var panelTitle = document.getElementById("panelTitle");
  var panelResult = document.getElementById("panelResult");
  var badge = document.getElementById("badge");
  var scoreTop = document.getElementById("scoreTop");
  var comboEl = document.getElementById("combo");
  var rankEl = document.getElementById("rank");
  var rPerfect = document.getElementById("rPerfect");
  var rGood = document.getElementById("rGood");
  var rMiss = document.getElementById("rMiss");
  var rCombo = document.getElementById("rCombo");

  var W = 480, H = 560, dpr = 1, laneW = 120, judgeY = 460;
  var state = "title";
  var auto = false;
  var songStart = 0;
  var notes = [];
  var effects = [];
  var pops = [];
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var counts = { perfect: 0, good: 0, miss: 0 };
  var laneFlash = [0, 0, 0, 0];
  var idleTimer = 0;
  var last = 0;

  function resize() {
    var rect = stage.getBoundingClientRect();
    W = Math.max(280, Math.round(rect.width));
    H = Math.max(300, Math.round(rect.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    laneW = W / LANES;
    judgeY = H - Math.max(70, H * 0.16);
    draw();
  }

  function laneX(i) { return i * laneW + laneW / 2; }

  function reset(autoPlay) {
    auto = !!autoPlay;
    state = "play";
    songStart = performance.now() + 600;
    notes = CHART.map(function (c) {
      return { t: c[0], lane: c[1], judged: false, result: null };
    });
    effects = [];
    pops = [];
    score = 0;
    combo = 0;
    maxCombo = 0;
    counts = { perfect: 0, good: 0, miss: 0 };
    scoreTop.textContent = "0";
    comboEl.textContent = "0";
    overlay.classList.add("hidden");
    badge.hidden = !auto;
  }

  function toTitle() {
    state = "title";
    auto = false;
    badge.hidden = true;
    panelTitle.hidden = false;
    panelResult.hidden = true;
    overlay.classList.remove("hidden");
    window.clearTimeout(idleTimer);
    idleTimer = window.setTimeout(function () { if (state === "title") reset(true); }, 2400);
  }

  function judge(note, diff) {
    note.judged = true;
    var res;
    if (diff <= HIT_MS * 0.42) { res = "perfect"; counts.perfect++; score += 1000; }
    else if (diff <= HIT_MS * 0.75) { res = "good"; counts.good++; score += 500; }
    else { res = "miss"; counts.miss++; }
    note.result = res;
    if (res === "miss") {
      combo = 0;
    } else {
      combo += 1;
      if (combo > maxCombo) maxCombo = combo;
    }
    laneFlash[note.lane] = 1;
    effects.push({ lane: note.lane, t: 0, res: res });
    pops.push({ text: res.toUpperCase(), lane: note.lane, t: 0, res: res });
    scoreTop.textContent = String(score);
    comboEl.textContent = String(combo);
  }

  function hit(lane) {
    if (state !== "play") return;
    var now = performance.now() - songStart;
    var best = null;
    var bestDiff = 1e9;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged || n.lane !== lane) continue;
      var diff = Math.abs(n.t - now);
      if (diff < bestDiff) { bestDiff = diff; best = n; }
    }
    if (!best) { laneFlash[lane] = 0.6; return; }
    if (bestDiff <= HIT_MS) judge(best, bestDiff);
  }

  function finish() {
    state = "result";
    badge.hidden = true;
    var total = counts.perfect + counts.good + counts.miss;
    var ratio = total ? counts.perfect / total : 0;
    var rank = ratio >= 0.999 ? "S" : ratio >= 0.85 ? "A" : ratio >= 0.6 ? "B" : "C";
    rankEl.textContent = rank;
    rPerfect.textContent = String(counts.perfect);
    rGood.textContent = String(counts.good);
    rMiss.textContent = String(counts.miss);
    rCombo.textContent = String(maxCombo);
    panelTitle.hidden = true;
    panelResult.hidden = false;
    overlay.classList.remove("hidden");
  }

  function update(dt, now) {
    if (state !== "play") return;
    var t = performance.now() - songStart;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged) continue;
      if (auto && t >= n.t - 12) {
        judge(n, 6);
        continue;
      }
      if (t > n.t + HIT_MS * 0.9) judge(n, 9999);
    }

    for (var e = effects.length - 1; e >= 0; e--) {
      effects[e].t += dt;
      if (effects[e].t > 0.5) effects.splice(e, 1);
    }
    for (var p = pops.length - 1; p >= 0; p--) {
      pops[p].t += dt;
      if (pops[p].t > 0.7) pops.splice(p, 1);
    }
    for (var l = 0; l < LANES; l++) laneFlash[l] = Math.max(0, laneFlash[l] - dt * 2.4);

    if (t > END_MS) finish();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0d1220");
    g.addColorStop(1, "#0a0e18");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // レーン
    for (var i = 0; i < LANES; i++) {
      ctx.fillStyle = "rgba(255,255,255,.02)";
      ctx.fillRect(i * laneW, 0, laneW - 2, H);
      if (laneFlash[i] > 0) {
        ctx.fillStyle = "rgba(255,255,255," + (laneFlash[i] * 0.10).toFixed(3) + ")";
        ctx.fillRect(i * laneW, 0, laneW - 2, H);
      }
      ctx.fillStyle = "rgba(255,255,255,.05)";
      ctx.fillRect(i * laneW + laneW - 2, 0, 2, H);
    }

    // 判定線
    ctx.strokeStyle = "rgba(242,244,248,.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, judgeY);
    ctx.lineTo(W, judgeY);
    ctx.stroke();
    for (var k = 0; k < LANES; k++) {
      ctx.strokeStyle = COLORS[k];
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(k * laneW + 12, judgeY);
      ctx.lineTo((k + 1) * laneW - 12, judgeY);
      ctx.stroke();
    }

    var t = state === "play" ? performance.now() - songStart : -9999;

    // ノート
    for (var n = 0; n < notes.length; n++) {
      var note = notes[n];
      if (note.judged && note.result !== "miss") continue;
      var prog = 1 - (note.t - t) / TRAVEL;
      if (prog < -0.05 || prog > 1.25) continue;
      var y = prog * judgeY;
      var w = laneW - 22;
      var x = note.lane * laneW + 11;
      ctx.fillStyle = COLORS[note.lane];
      ctx.globalAlpha = note.judged ? 0.25 : 1;
      ctx.beginPath();
      ctx.moveTo(x + 6, y - 9);
      ctx.arcTo(x + w, y - 9, x + w, y + 9, 6);
      ctx.arcTo(x + w, y + 9, x, y + 9, 6);
      ctx.arcTo(x, y + 9, x, y - 9, 6);
      ctx.arcTo(x, y - 9, x + w, y - 9, 6);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ヒットエフェクト
    for (var e = 0; e < effects.length; e++) {
      var ef = effects[e];
      var r = 12 + ef.t * 90;
      ctx.strokeStyle = (ef.res === "miss" ? "rgba(255,107,107," : "rgba(255,255,255,") + Math.max(0, 1 - ef.t * 2).toFixed(2) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(laneX(ef.lane), judgeY, r, 0, 6.283);
      ctx.stroke();
    }

    // 判定ポップ
    for (var p = 0; p < pops.length; p++) {
      var po = pops[p];
      var col = po.res === "perfect" ? "#ffd23f" : po.res === "good" ? "#5ad1a0" : "#ff6b6b";
      ctx.globalAlpha = Math.max(0, 1 - po.t * 1.5);
      ctx.fillStyle = col;
      ctx.font = "900 16px " + '"Hiragino Sans","Yu Gothic",system-ui,sans-serif';
      ctx.textAlign = "center";
      ctx.fillText(po.text, laneX(po.lane), judgeY - 30 - po.t * 40);
      ctx.globalAlpha = 1;
    }
  }

  var lastT = 0;
  function loop(now) {
    if (!lastT) lastT = now;
    var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    update(dt, now);
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === "title") { reset(false); return; }
    if (state === "result") { reset(false); return; }
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * W;
    var lane = Math.max(0, Math.min(LANES - 1, Math.floor(x / laneW)));
    hit(lane);
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "BUTTON" || tag === "INPUT") {
      if (e.key === " " || e.key === "Enter") return;
    }
    var k = e.key.toLowerCase();
    if (k === " " || k === "enter") {
      e.preventDefault();
      if (state !== "play") reset(false);
      return;
    }
    if (state !== "play") return;
    if (Object.prototype.hasOwnProperty.call(KEYS, k)) {
      e.preventDefault();
      hit(KEYS[k]);
    }
  });

  document.getElementById("startBtn").addEventListener("click", function () { reset(false); });
  document.getElementById("againBtn").addEventListener("click", function () { reset(false); });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener("resize", resize);

  resize();
  toTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
