<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドミノ倒し — 並べて、倒して、眺める。</title>
<meta name="description" content="画面をタップしてドミノを並べ、「倒す」で一気に連鎖。色とりどりのドミノが波のように倒れていきます。">
<meta property="og:title" content="ドミノ倒し — 並べて、倒して、眺める。">
<meta property="og:description" content="タップでドミノを並べて、「倒す」を押すだけ。連鎖が気持ちいい、眺めるだけのドミノ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/domino/">
<meta property="og:site_name" content="ドミノ倒し">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#fdf7ea">
<style>
  :root{
    --paper:#fdf7ea;
    --ink:#241f1a;
    --muted:#8a7d6b;
    --accent:#e4572e;
    --line:rgba(36,31,26,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 500px at 100% -10%, #ffe8cf 0%, transparent 60%),
      radial-gradient(700px 420px at -10% 110%, #e9f1e4 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
  }
  .wrap{max-width:780px;margin:auto;width:100%;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--accent);font-weight:800}
  h1{margin:.26em 0 .1em;font-size:clamp(1.8rem,7vw,2.5rem);letter-spacing:-.03em;line-height:1.08}
  .lead{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.65}
  .stage{
    position:relative;width:100%;
    height:clamp(320px,50vh,500px);
    border-radius:18px;overflow:hidden;
    background:#fffdf7;
    border:2px solid var(--ink);
    box-shadow:0 14px 34px rgba(36,31,26,.16);
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #board{display:block;width:100%;height:100%;cursor:crosshair}
  .tag{
    position:absolute;right:12px;top:12px;
    font-size:10px;letter-spacing:.18em;color:var(--muted);
    pointer-events:none;
  }
  .controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .controls button{
    font:inherit;font-size:13.5px;font-weight:800;letter-spacing:.03em;
    border-radius:11px;min-height:48px;padding:11px 14px;cursor:pointer;
    color:var(--ink);background:#fffdf8;border:1.5px solid var(--line);
    transition:border-color .15s,background .15s,transform .08s;
  }
  .controls button:hover{border-color:var(--ink);background:#fffaf0}
  .controls button:active{transform:translateY(1px)}
  .controls button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .controls .topple{
    flex:1 1 130px;color:#fff;background:var(--accent);
    border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  }
  .controls .topple:hover{background:#d14a24}
  .controls .topple:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .length{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
  .length input[type=range]{flex:1;min-width:0;height:30px;accent-color:var(--accent);cursor:pointer}
  .length output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:0}
  .status{margin:12px 0 0;font-size:12px;color:var(--muted);min-height:1.4em}
  .status b{color:var(--ink)}
  .hint{margin-top:8px;font-size:11px;color:rgba(36,31,26,.45);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">DOMINO</p>
  <h1>ドミノ倒し</h1>
  <p class="lead">画面をタップして並べるか、「並べる」でセット。「倒す」で、波のように倒れていきます。</p>

  <div class="stage" id="stage">
    <canvas id="board" role="img" aria-label="ドミノを並べて倒すボード"></canvas>
    <div class="tag">TAP TO ADD</div>
  </div>

  <div class="controls">
    <button type="button" id="line">並べる</button>
    <button type="button" id="dense">ぎっしり</button>
    <button type="button" class="topple" id="topple">倒す</button>
    <button type="button" id="reset">リセット</button>
  </div>

  <div class="length">
    <label for="length">長さ</label>
    <input id="length" type="range" min="48" max="100" step="4" value="66" aria-label="ドミノの長さ">
    <output id="lengthVal" for="length">66</output>
  </div>

  <p class="status" id="status" aria-live="polite">まずは「並べる」から。</p>
  <p class="hint">ドミノはタップした位置に追加できます（最大90枚）。スライダーで長さを変えると、背の高いドミノは少ない枚数でも遠くまで届きます。「倒す」で、重力と衝突で連鎖する物理演算が走ります。倒れたあとにもう一度押すと、立ち直ってからまた倒れます。</p>
</main>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var statusEl = document.getElementById("status");

  var W = 600, H = 380, dpr = 1, groundY = 240;

  var COLORS = ["#e4572e", "#f2b134", "#2a9d8f", "#3d6fb4", "#d1495b", "#7b5ea7", "#4f9d69", "#e08a2e"];
  var DW = 27, DH = 66;
  var dominoH = DH;
  var scene = { count: 20, w: DW, h: DH, mode: "line" };
  var MAX = 90;
  var HALF_PI = Math.PI / 2;

  // Dominoes rotate as rigid bodies about their leading bottom edge.
  // Gravity and contact impulses do the rest; nothing is pre-scripted.
  var GRAVITY = 3000;
  var DT = 1 / 120;
  var REST = 0.04;
  var DAMP = 0.9995;

  var bodies = [];
  var running = false;
  var toppleAt = 0;
  var acc = 0;
  var last = 0;
  var finished = false;

  function makeBody(x, w, h, color) {
    return {
      x: x,
      theta: 0,
      omega: 0,
      w: w,
      h: h,
      hw: w / 2,
      hh: h / 2,
      invI: 3 / (w * w + h * h),
      color: color,
      hit: false
    };
  }

  function balanceOmega(b) {
    var dh = Math.sqrt(b.hw * b.hw + b.hh * b.hh) - b.hh;
    return Math.sqrt(2 * GRAVITY * dh * b.invI);
  }

  function pivotX(b) { return b.x + b.hw; }

  function topCorner(b) {
    var px = pivotX(b);
    return {
      x: px + b.h * Math.sin(b.theta),
      y: groundY - b.h * Math.cos(b.theta)
    };
  }

  function resize() {
    W = Math.max(280, Math.round(stage.clientWidth));
    H = Math.max(240, Math.round(stage.clientHeight));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    groundY = Math.round(H * 0.72);
    bodies.forEach(function (b) {
      b.x = Math.max(b.hw + 8, Math.min(W - b.hw - 8, b.x));
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function rebuild(count, w, h, mode) {
    bodies = [];
    running = false;
    finished = false;
    var margin = Math.max(24, w * 1.25);
    var usable = W - margin * 2;
    var maxCount = Math.max(2, Math.floor(usable / (w + 4)) + 1);
    if (count > maxCount) count = maxCount;
    var step = usable / (count - 1);
    for (var i = 0; i < count; i++) {
      bodies.push(makeBody(margin + step * i, w, h, COLORS[i % COLORS.length]));
    }
    scene = { count: count, w: w, h: h, mode: mode || "custom" };
    statusEl.textContent = count + "枚、長さ" + h + "で並べました。「倒す」を押してください。";
  }

  function addDomino(x) {
    if (bodies.length >= MAX) {
      statusEl.textContent = "これ以上は置けません（最大" + MAX + "枚）。";
      return;
    }
    var px = Math.max(DW / 2 + 8, Math.min(W - DW / 2 - 8, x));
    for (var i = 0; i < bodies.length; i++) {
      if (Math.abs(bodies[i].x - px) < DW + 3) {
        statusEl.textContent = "そこは詰まっています。少しずらしてください。";
        return;
      }
    }
    bodies.push(makeBody(px, DW, dominoH, COLORS[bodies.length % COLORS.length]));
    bodies.sort(function (a, b) { return a.x - b.x; });
    scene = { count: bodies.length, w: DW, h: dominoH, mode: "custom" };
    statusEl.textContent = bodies.length + "枚。タップで追加、「倒す」で連鎖。";
  }

  function standUpAll() {
    bodies.sort(function (a, b) { return a.x - b.x; });
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      b.theta = 0;
      b.omega = 0;
      b.hit = false;
    }
  }

  function topple() {
    if (!bodies.length) {
      statusEl.textContent = "まずは「並べる」から。";
      return;
    }
    if (running) return;
    if (fallenCount() > 0) standUpAll();
    bodies.sort(function (a, b) { return a.x - b.x; });
    bodies[0].omega = balanceOmega(bodies[0]) * 1.7;
    running = true;
    finished = false;
    toppleAt = performance.now();
    acc = 0;
    statusEl.textContent = "倒しています…";
  }

  function transferHit(a, b) {
    var contact = topCorner(a);
    var leftX = b.x - b.hw;
    if (contact.x < leftX) return;
    if (b.theta > 0.35) return;

    var rAy = contact.y - groundY;
    var rBy = contact.y - groundY;
    var vA = -a.omega * rAy;
    var vB = -b.omega * rBy;
    var vn = vB - vA;
    if (vn >= 0) return;

    var denom = rAy * rAy * a.invI + rBy * rBy * b.invI;
    if (denom <= 0) return;
    var j = -(1 + REST) * vn / denom;
    if (j < 0) j = 0;
    b.omega += -rBy * j * b.invI;

    // The next domino needs enough angular speed to pass its own balance point.
    var target = balanceOmega(b) * 1.06;
    if (b.omega < target) b.omega = target;
    a.hit = true;
  }

  function step(dt) {
    var i, b;
    for (i = 0; i < bodies.length; i++) {
      b = bodies[i];
      if (b.theta >= HALF_PI) continue;
      var torque = GRAVITY * (b.hh * Math.sin(b.theta) - b.hw * Math.cos(b.theta));
      b.omega += torque * b.invI * dt;
      b.omega *= DAMP;
      b.theta += b.omega * dt;

      if (b.theta <= 0) {
        b.theta = 0;
        if (b.omega < 0) b.omega = 0;
      }
      if (b.theta >= HALF_PI) {
        b.theta = HALF_PI;
        b.omega = 0;
      }
    }

    for (i = 0; i < bodies.length - 1; i++) {
      var a = bodies[i], c = bodies[i + 1];
      if (a.hit || a.omega <= 0.01 || a.theta <= 0.02) continue;
      transferHit(a, c);
    }
  }

  function isMoving() {
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (b.theta > 0.001 && b.theta < HALF_PI - 0.001) return true;
      if (Math.abs(b.omega) > 0.03) return true;
    }
    return false;
  }

  function fallenCount() {
    var n = 0;
    for (var i = 0; i < bodies.length; i++) {
      if (bodies[i].theta > 0.9) n++;
    }
    return n;
  }

  function drawDomino(b) {
    var px = pivotX(b);
    var cx = px - b.hw * Math.cos(b.theta) + b.hh * Math.sin(b.theta);
    ctx.save();
    ctx.fillStyle = "rgba(36,31,26,.10)";
    ctx.beginPath();
    ctx.ellipse(cx + 8, groundY + 2, Math.max(16, b.hw + 7), 5, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(px, groundY);
    ctx.rotate(b.theta);

    ctx.fillStyle = b.color;
    ctx.strokeStyle = "#241f1a";
    ctx.lineWidth = 1.6;
    roundRect(-b.w, -b.h, b.w, b.h, 3);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255,253,247,.92)";
    ctx.fillRect(-b.w + 2, -b.h * 0.52, b.w - 4, 1.6);

    ctx.fillStyle = "rgba(255,253,247,.95)";
    ctx.beginPath();
    ctx.arc(-b.w / 2, -b.h * 0.75, 2.2, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-b.w / 2 - 3.2, -b.h * 0.28, 1.8, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-b.w / 2 + 3.2, -b.h * 0.28, 1.8, 0, 6.283);
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#fffdf8");
    g.addColorStop(1, "#fbf1dc");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "rgba(36,31,26,.05)";
    for (var gx = 20; gx < W; gx += 28) {
      for (var gy = 20; gy < groundY - 10; gy += 28) {
        ctx.fillRect(gx, gy, 1.5, 1.5);
      }
    }

    ctx.fillStyle = "rgba(36,31,26,.07)";
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = "rgba(36,31,26,.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 0.5);
    ctx.lineTo(W, groundY + 0.5);
    ctx.stroke();

    var sorted = bodies.slice().sort(function (a, b) { return a.x - b.x; });
    for (var i = 0; i < sorted.length; i++) drawDomino(sorted[i]);
  }

  function finishRun() {
    running = false;
    finished = true;
    var n = bodies.length;
    var f = fallenCount();
    var secs = ((performance.now() - toppleAt) / 1000).toFixed(1);
    if (f === n) statusEl.textContent = n + "枚、" + secs + "秒で全部倒れました。";
    else statusEl.textContent = n + "枚中" + f + "枚倒れました（" + secs + "秒）。";
  }

  function loop(now) {
    if (!last) last = now;
    var frame = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (running) {
      acc += frame;
      var steps = 0;
      while (acc >= DT && steps < 8) {
        step(DT);
        acc -= DT;
        steps++;
      }
      if (steps === 8) acc = 0;
      if (now - toppleAt > 500 && !isMoving()) finishRun();
    } else {
      acc = 0;
    }

    render();
    requestAnimationFrame(loop);
  }

  function buildLine() { rebuild(20, DW, dominoH, "line"); }
  function buildDense() { rebuild(26, 18, Math.round(dominoH * 0.79), "dense"); }

  document.getElementById("line").addEventListener("click", buildLine);
  document.getElementById("dense").addEventListener("click", buildDense);

  var lengthEl = document.getElementById("length");
  var lengthVal = document.getElementById("lengthVal");
  lengthEl.addEventListener("input", function () {
    dominoH = parseInt(lengthEl.value, 10) || DH;
    lengthVal.textContent = dominoH;
    if (!bodies.length || running) return;
    if (scene.mode === "line") rebuild(scene.count, DW, dominoH, "line");
    else if (scene.mode === "dense") rebuild(scene.count, 18, Math.round(dominoH * 0.79), "dense");
  });
  document.getElementById("reset").addEventListener("click", function () {
    bodies = [];
    running = false;
    finished = false;
    statusEl.textContent = "リセットしました。タップで並べてください。";
  });
  document.getElementById("topple").addEventListener("click", topple);

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (running) return;
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * W;
    addDomino(x);
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "BUTTON") return;
      e.preventDefault();
      topple();
    }
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
