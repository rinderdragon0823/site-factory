<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つぶつぶ — 無限の気泡をつぶす。</title>
<meta name="description" content="画面いっぱいの気泡をつぶすだけ。指でなぞっても、ぜんぶつぶしても、すっきりします。">
<meta property="og:title" content="つぶつぶ — 無限の気泡をつぶす。">
<meta property="og:description" content="気泡をつぶすだけの、静かな快感。つぶした数を数えています。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/tsubutsubu/">
<meta property="og:site_name" content="つぶつぶ">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#eef4f8">
<style>
  :root{
    --paper:#eef4f8;
    --ink:#1d2b33;
    --muted:#6f808a;
    --accent:#2a9d8f;
    --line:rgba(29,43,51,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 500px at 100% -10%, #e3f2ff 0%, transparent 60%),
      radial-gradient(700px 420px at -10% 110%, #eaf7f2 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:560px;margin:auto;width:100%;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
  .kicker{margin:0;font-size:10px;letter-spacing:.3em;color:var(--accent);font-weight:800}
  h1{margin:.26em 0 .1em;font-size:clamp(1.7rem,6.6vw,2.3rem);letter-spacing:-.02em;line-height:1.08}
  .lead{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.65}

  .stage{
    position:relative;
    height:clamp(320px,48vh,460px);
    border-radius:18px;
    background:linear-gradient(160deg,#f7fbfe,#dde9f1);
    border:1px solid rgba(29,43,51,.18);
    box-shadow:inset 0 0 40px rgba(120,150,170,.18), 0 14px 34px rgba(29,43,51,.12);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  #sheet{display:block;width:100%;height:100%}

  .hud{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px}
  .hud .n{font-size:clamp(1.4rem,5.6vw,1.8rem);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .hud .n small{font-size:.42em;color:var(--muted);font-weight:800;margin-left:4px;letter-spacing:0}
  .hud .rest{font-size:11px;color:var(--muted)}

  .controls{display:flex;gap:8px;margin-top:10px}
  #all{
    flex:1;font:inherit;font-size:15px;font-weight:900;letter-spacing:.06em;
    color:#f7fffd;background:var(--accent);border:2px solid #12262a;border-radius:12px;
    padding:14px;min-height:52px;cursor:pointer;
    box-shadow:4px 4px 0 #12262a;transition:transform .08s,box-shadow .08s,background .15s;
  }
  #all:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #12262a}
  #reset{
    flex:0 0 108px;font:inherit;font-size:12.5px;font-weight:800;
    color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:12px;min-height:52px;cursor:pointer;
  }
  #reset:hover{border-color:var(--ink)}
  .controls button:focus-visible{outline:3px solid #12262a;outline-offset:3px}

  .status{margin:10px 0 0;font-size:11.5px;color:var(--muted);min-height:1.4em}
  .note{margin-top:8px;font-size:10.5px;color:rgba(29,43,51,.42);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">BUBBLE WRAP</p>
  <h1>つぶつぶ</h1>
  <p class="lead">画面いっぱいの気泡。つぶすだけ。なぞっても、ぜんぶでも。</p>

  <div class="stage" id="stage">
    <canvas id="sheet" role="img" aria-label="気泡シート"></canvas>
  </div>

  <div class="hud">
    <div class="n"><span id="popped">0</span><small>/ <span id="total">0</span> 個</small></div>
    <div class="rest" id="rest">のこり 0 個</div>
  </div>

  <div class="controls">
    <button type="button" id="all">ぜんぶつぶす</button>
    <button type="button" id="reset">リセット</button>
  </div>

  <p class="status" id="status" aria-live="polite">つぶしてみてください。</p>
  <p class="note">音は鳴りません。指でなぞると、通ったところからつぶれます。</p>
</main>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sheet");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var poppedEl = document.getElementById("popped");
  var totalEl = document.getElementById("total");
  var restEl = document.getElementById("rest");
  var statusEl = document.getElementById("status");

  var W = 480, H = 380, dpr = 1;
  var D = 34;
  var bubbles = [];
  var popped = 0;
  var allAt = -1;

  function resize() {
    var rect = stage.getBoundingClientRect();
    W = Math.max(260, Math.round(rect.width));
    H = Math.max(240, Math.round(rect.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    build();
  }

  function build() {
    D = Math.max(24, Math.min(40, Math.floor(W / 13)));
    var cols = Math.max(4, Math.floor((W - 12) / D));
    var rows = Math.max(4, Math.floor((H - 12) / D));
    var ox = (W - (cols - 1) * D) / 2;
    var oy = (H - (rows - 1) * D) / 2;
    bubbles = [];
    popped = 0;
    allAt = -1;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var stagger = r % 2 === 0 ? 0 : D * 0.5;
        var x = ox + c * D + stagger;
        if (x > W - D * 0.3) continue;
        bubbles.push({
          x: x,
          y: oy + r * D,
          r: D * 0.44,
          popped: false,
          popT: 0,
          delay: 0,
          appear: 0
        });
      }
    }
    totalEl.textContent = String(bubbles.length);
    updateHud();
    draw(performance.now());
  }

  function updateHud() {
    poppedEl.textContent = String(popped);
    restEl.textContent = "のこり " + (bubbles.length - popped) + " 個";
  }

  function popAt(x, y) {
    var hit = null;
    var best = 1e9;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      if (b.popped) continue;
      var dx = b.x - x, dy = b.y - y;
      var d2 = dx * dx + dy * dy;
      if (d2 <= (b.r * 1.35) * (b.r * 1.35) && d2 < best) {
        best = d2;
        hit = b;
      }
    }
    if (hit) {
      hit.popped = true;
      hit.popT = performance.now();
      popped += 1;
      updateHud();
      if (popped === bubbles.length) statusEl.textContent = "ぜんぶ、つぶしました。";
      else if (popped % 25 === 0) statusEl.textContent = popped + "個、つぶしました。";
      draw(performance.now());
    }
  }

  function popAll() {
    if (popped === bubbles.length) return;
    var now = performance.now();
    allAt = now;
    var maxDelay = 900;
    bubbles.forEach(function (b) {
      if (b.popped) return;
      var d = Math.sqrt(Math.pow(b.x / W, 2) + Math.pow(1 - b.y / H, 2));
      b.delay = d * maxDelay;
    });
    statusEl.textContent = "ぜんぶ、つぶしています…";
  }

  function reset() {
    var now = performance.now();
    bubbles.forEach(function (b) {
      b.popped = false;
      b.popT = 0;
      b.appear = now + Math.random() * 220;
    });
    popped = 0;
    allAt = -1;
    updateHud();
    statusEl.textContent = "新しいシートです。";
    draw(now);
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // シートのツヤ
    var sheen = ctx.createLinearGradient(0, 0, W, H);
    sheen.addColorStop(0, "rgba(255,255,255,.55)");
    sheen.addColorStop(0.5, "rgba(255,255,255,0)");
    sheen.addColorStop(1, "rgba(190,215,230,.35)");
    ctx.fillStyle = sheen;
    ctx.fillRect(0, 0, W, H);

    var allElapsed = allAt > 0 ? now - allAt : -1;

    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];

      if (!b.popped && allAt > 0 && allElapsed >= b.delay) {
        b.popped = true;
        b.popT = now;
        popped += 1;
      }

      var grow = 1;
      if (b.appear && now < b.appear) continue;
      if (b.appear && now - b.appear < 260) {
        grow = Math.min(1, (now - b.appear) / 260);
        grow = 0.6 + 0.4 * grow;
      }

      if (!b.popped) {
        var g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
        g.addColorStop(0, "rgba(255,255,255,.95)");
        g.addColorStop(0.55, "rgba(215,235,247,.72)");
        g.addColorStop(1, "rgba(160,193,214,.62)");
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * grow, 0, 6.283);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.75)";
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.36, b.r * 0.22, 0, 6.283);
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.92, 0, 6.283);
        ctx.fillStyle = "rgba(203,220,231,.55)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.5, 0, 6.283);
        ctx.strokeStyle = "rgba(120,150,170,.35)";
        ctx.lineWidth = 1;
        ctx.stroke();

        var age = now - b.popT;
        if (age >= 0 && age < 300) {
          var k = age / 300;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * (1 + k * 0.7), 0, 6.283);
          ctx.strokeStyle = "rgba(255,255,255," + (0.7 * (1 - k)).toFixed(2) + ")";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    if (allAt > 0) {
      updateHud();
      if (popped === bubbles.length) {
        allAt = -1;
        statusEl.textContent = "ぜんぶ、つぶしました。";
      }
    }

    if (bubbles.length && popped === 0 && allAt < 0) {
      restEl.textContent = "のこり " + bubbles.length + " 個";
    }
  }

  var last = 0;
  function loop(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    draw(now);
    requestAnimationFrame(loop);
  }

  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * W,
      y: (e.clientY - rect.top) / rect.height * H
    };
  }

  var drawing = false;

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    drawing = true;
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    var p = pos(e);
    popAt(p.x, p.y);
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    e.preventDefault();
    var p = pos(e);
    popAt(p.x, p.y);
  });

  function end() { drawing = false; }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("pointerleave", end);

  document.getElementById("all").addEventListener("click", popAll);
  document.getElementById("reset").addEventListener("click", reset);

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
