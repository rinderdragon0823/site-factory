<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花火文字 — その文字、夜空に打ち上げる。</title>
<meta name="description" content="好きな文字を入れると、花火になって夜空に浮かびます。名前でも、一言でも。打ち上げて、眺めるだけ。">
<meta property="og:title" content="花火文字 — その文字、夜空に打ち上げる。">
<meta property="og:description" content="入力した文字が、花火の粒になって夜空に浮かぶ。名前でも、一言でも。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rinderdragon0823.github.io/site-factory/hanabi-moji/">
<meta property="og:site_name" content="花火文字">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#070b18">
<style>
  :root{
    --night:#070b18;
    --panel:#101728;
    --gold:#ffd166;
    --text:#f5f2e9;
    --muted:rgba(245,242,233,.58);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, #1b2447 0%, transparent 60%),
      radial-gradient(700px 460px at 0% 110%, #151d36 0%, transparent 55%),
      var(--night);
    color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .wrap{max-width:760px;margin:auto;width:100%;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
  .kicker{margin:0;font-size:10px;letter-spacing:.28em;color:var(--gold);font-weight:800}
  h1{margin:.26em 0 .12em;font-size:clamp(1.8rem,7vw,2.5rem);letter-spacing:-.03em;line-height:1.08}
  .lead{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.65}

  .stage{
    position:relative;width:100%;
    height:clamp(340px,56vh,560px);
    border-radius:18px;overflow:hidden;
    background:#070b18;
    border:1px solid rgba(245,242,233,.12);
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #sky{display:block;width:100%;height:100%}
  .badge{
    position:absolute;left:12px;bottom:12px;
    font-size:10px;letter-spacing:.2em;color:rgba(245,242,233,.42);
    pointer-events:none;
  }

  .controls{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  #word{
    flex:1 1 240px;min-width:0;
    font:inherit;font-size:clamp(1.05rem,4vw,1.25rem);font-weight:800;letter-spacing:.04em;
    color:var(--text);background:var(--panel);
    border:1.5px solid rgba(245,242,233,.16);border-radius:12px;
    padding:12px 14px;min-height:52px;outline:none;
  }
  #word::placeholder{color:rgba(245,242,233,.3);font-weight:600}
  #word:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.16)}
  #fire{
    flex:0 0 auto;
    font:inherit;font-size:15px;font-weight:900;letter-spacing:.05em;
    color:#1a1405;background:var(--gold);
    border:0;border-radius:12px;padding:12px 18px;min-height:52px;cursor:pointer;
    box-shadow:0 4px 0 #b98f2c;
    transition:transform .08s,box-shadow .08s,filter .15s;
  }
  #fire:hover{filter:brightness(1.05)}
  #fire:active{transform:translateY(3px);box-shadow:0 1px 0 #b98f2c}
  #fire:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .chips{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .chips button{
    font:inherit;font-size:12px;font-weight:700;
    color:var(--muted);background:transparent;
    border:1px solid rgba(245,242,233,.16);border-radius:999px;
    padding:7px 12px;min-height:36px;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .chips button:hover{color:var(--text);border-color:var(--gold)}
  .chips button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .status{margin:10px 0 0;font-size:11.5px;color:var(--muted);min-height:1.4em}
  .status b{color:var(--gold)}
  .note{margin-top:12px;font-size:11px;color:rgba(245,242,233,.36);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">HANABI TYPE</p>
  <h1>花火文字</h1>
  <p class="lead">文字を入れると、その文字が花火になって夜空に浮かびます。名前でも、一言でも。</p>

  <div class="stage" id="stage">
    <canvas id="sky" role="img" aria-label="花火が打ち上がる夜空"></canvas>
    <div class="badge">TAP TO LAUNCH</div>
  </div>

  <div class="controls">
    <label for="word" class="sr" style="position:absolute;left:-9999px">花火にする文字</label>
    <input id="word" type="text" maxlength="8" value="花火" autocomplete="off" spellcheck="false" placeholder="花火">
    <button type="button" id="fire">打ち上げる</button>
  </div>
  <div class="chips" role="group" aria-label="文字の候補">
    <button type="button" data-word="花火">花火</button>
    <button type="button" data-word="ありがとう">ありがとう</button>
    <button type="button" data-word="推し">推し</button>
    <button type="button" data-word="合格">合格</button>
    <button type="button" data-word="誕生日">誕生日</button>
  </div>

  <p class="status" id="status" aria-live="polite">文字を入れて、打ち上げてください。</p>
  <p class="note">8文字まで。夜空をタップしても打ち上がります。花火はだいたい4秒で消えます。</p>
</main>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var input = document.getElementById("word");
  var statusEl = document.getElementById("status");

  var W = 600, H = 500, dpr = 1;
  var stars = [];
  var particles = [];
  var rocket = null;
  var phase = "idle";
  var phaseT = 0;
  var pending = [];
  var sky = null;
  var currentText = "";

  var COLORS = [
    "255,214,120", "255,196,96", "255,232,170", "255,176,104", "255,244,214"
  ];

  for (var i = 0; i < 90; i++) {
    stars.push({ x: Math.random(), y: Math.random() * 0.78, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6.28 });
  }

  function resize() {
    var rect = stage.getBoundingClientRect();
    W = Math.max(280, Math.round(rect.width));
    H = Math.max(240, Math.round(rect.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#050912");
    g.addColorStop(0.55, "#0a1024");
    g.addColorStop(1, "#111a33");
    sky = g;
    render(0);
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function samplePoints(text) {
    var oc = document.createElement("canvas");
    oc.width = 900;
    oc.height = 300;
    var o = oc.getContext("2d");
    var size = 170;
    var font = '900 ' + size + 'px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
    o.font = font;
    var w = o.measureText(text).width;
    if (w > 840) {
      size = Math.floor(size * 840 / w);
      font = '900 ' + size + 'px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
      o.font = font;
    }
    o.textAlign = "center";
    o.textBaseline = "middle";
    o.fillStyle = "#fff";
    o.clearRect(0, 0, 900, 300);
    o.fillText(text, 450, 150);

    var data = o.getImageData(0, 0, 900, 300).data;
    var pts = [];
    var step = 2;
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (var y = 0; y < 300; y += step) {
      for (var x = 0; x < 900; x += step) {
        if (data[(y * 900 + x) * 4 + 3] > 130) {
          pts.push([x, y]);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (!pts.length) return [];

    var bw = Math.max(1, maxX - minX);
    var bh = Math.max(1, maxY - minY);
    var s = Math.min((W * 0.82) / bw, (H * 0.46) / bh, 2.6);
    var cx = (minX + maxX) / 2;
    var cy = (minY + maxY) / 2;
    var baseY = H * 0.40;

    var out = pts.map(function (p) {
      return {
        x: W / 2 + (p[0] - cx) * s + (Math.random() - 0.5) * 1.6,
        y: baseY + (p[1] - cy) * s + (Math.random() - 0.5) * 1.6
      };
    });

    if (out.length > 2400) {
      for (var k = out.length - 1; k > 0; k--) {
        var j = (Math.random() * (k + 1)) | 0;
        var tmp = out[k]; out[k] = out[j]; out[j] = tmp;
      }
      out = out.slice(0, 2400);
    }
    return out;
  }

  function launch() {
    var text = String(input.value || "").trim().slice(0, 8);
    if (!text) {
      input.focus();
      statusEl.textContent = "文字を入れてください。";
      return;
    }
    var pts = samplePoints(text);
    if (!pts.length) {
      statusEl.textContent = "その文字は打ち上げられませんでした。";
      return;
    }
    pending = pts;
    currentText = text;
    particles = [];
    phase = "rocket";
    phaseT = 0;
    rocket = { y: H + 12, x: W / 2 };
    statusEl.textContent = "「" + text + "」を打ち上げ中…";
  }

  function explode() {
    var px = rocket.x;
    var py = rocket.y;
    rocket = null;
    phase = "burst";
    phaseT = 0;
    particles = pending.map(function (p, i) {
      var color = COLORS[Math.min(COLORS.length - 1, Math.floor((p.x / W) * COLORS.length))];
      if (Math.random() < 0.04) color = "255,255,255";
      return {
        x: px + (Math.random() - 0.5) * 8,
        y: py + (Math.random() - 0.5) * 8,
        px: px,
        py: py,
        sx: px,
        sy: py,
        tx: p.x,
        ty: p.y,
        age: -(Math.random() * 0.12),
        size: 1.4 + Math.random() * 1.1,
        color: color
      };
    });
    statusEl.textContent = "「" + currentText + "」、夜空に浮かびました。";
  }

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function updateParticles(dt) {
    var fly = 0.9;
    var hold = 1.7;
    var fall = 1.4;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.px = p.x;
      p.py = p.y;
      p.age += dt;
      if (p.age <= 0) {
        p.x = p.sx;
        p.y = p.sy;
        p.alpha = 0;
        continue;
      }
      if (p.age < fly) {
        var k = easeOut(p.age / fly);
        p.x = p.sx + (p.tx - p.sx) * k;
        p.y = p.sy + (p.ty - p.sy) * k;
        p.alpha = 0.25 + 0.75 * k;
      } else if (p.age < fly + hold) {
        var t = p.age - fly;
        p.x = p.tx + Math.sin(t * 6 + i) * 0.7;
        p.y = p.ty + Math.cos(t * 5 + i) * 0.7;
        p.alpha = 0.95 + Math.sin(t * 20 + i) * 0.05;
      } else {
        var f = p.age - fly - hold;
        p.x = p.tx + f * 6;
        p.y = p.ty + f * f * 44;
        p.alpha = Math.max(0, 1 - f / fall);
      }
    }
  }

  function render(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = sky || "#070b18";
    ctx.fillRect(0, 0, W, H);

    var now = performance.now() / 1000;
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      var tw = 0.45 + 0.55 * Math.abs(Math.sin(now * 0.7 + st.p));
      ctx.fillStyle = "rgba(245,242,233," + (tw * 0.7).toFixed(2) + ")";
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }

    // 地面のシルエット
    ctx.fillStyle = "#04070f";
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H * 0.9);
    ctx.quadraticCurveTo(W * 0.2, H * 0.86, W * 0.38, H * 0.9);
    ctx.quadraticCurveTo(W * 0.6, H * 0.95, W * 0.78, H * 0.89);
    ctx.quadraticCurveTo(W * 0.92, H * 0.85, W, H * 0.9);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    if (rocket) {
      ctx.globalCompositeOperation = "lighter";
      var grd = ctx.createLinearGradient(rocket.x, rocket.y, rocket.x, rocket.y + 34);
      grd.addColorStop(0, "rgba(255,225,150,.9)");
      grd.addColorStop(1, "rgba(255,140,60,0)");
      ctx.strokeStyle = grd;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rocket.x, rocket.y);
      ctx.lineTo(rocket.x, rocket.y + 34);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,240,200,.95)";
      ctx.beginPath();
      ctx.arc(rocket.x, rocket.y, 3.2, 0, 6.283);
      ctx.fill();
    }

    if (particles.length) {
      ctx.globalCompositeOperation = "lighter";
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.alpha <= 0.01) continue;
        var a = Math.max(0, Math.min(1, p.alpha));
        ctx.strokeStyle = "rgba(" + p.color + "," + (a * 0.55).toFixed(3) + ")";
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.fillStyle = "rgba(" + p.color + "," + a.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.62, 0, 6.283);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  var last = 0;
  function loop(now) {
    if (!last) last = now;
    var dt = Math.min(0.04, Math.max(0, (now - last) / 1000));
    last = now;

    if (phase === "rocket") {
      phaseT += dt;
      var k = Math.min(1, phaseT / 0.62);
      var startY = H + 12;
      rocket.y = startY + (H * 0.40 - startY) * easeOutCubic(k);
      if (k >= 1) explode();
    } else if (phase === "burst") {
      phaseT += dt;
      updateParticles(dt);
      if (phaseT > 4.6) {
        phase = "idle";
        particles = [];
        statusEl.textContent = "もう一回、打ち上げますか?";
      }
    }

    render(dt);
    requestAnimationFrame(loop);
  }

  document.getElementById("fire").addEventListener("click", launch);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      launch();
    }
  });

  document.querySelectorAll(".chips button").forEach(function (b) {
    b.addEventListener("click", function () {
      input.value = b.getAttribute("data-word");
      launch();
    });
  });

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    launch();
  }, { passive: false });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
